name: Download Build Dependencies
permissions:
  contents: read
  actions: write

on:
  workflow_call:

jobs:
  download-dependencies:
    name: Cache Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Clone AnyKernel3
      run: |
        git clone https://github.com/WildKernels/AnyKernel3.git -b gki-2.0 --depth=1
        rm -rf AnyKernel3/.git

    - name: Remove forced S928B CPUFreq governor
      run: |
        AK3="AnyKernel3/anykernel.sh"
        [ -f "$AK3" ] || { echo "::error::AnyKernel3 anykernel.sh not found"; exit 1; }

        python3 - "$AK3" <<'PY'
        from pathlib import Path
        import sys

        path = Path(sys.argv[1])
        text = path.read_text()
        marker = '# S928B daily: remove forced CPUFreq governor policy'

        if marker not in text:
            needle = 'split_boot\n'
            if needle not in text:
                raise SystemExit('split_boot call not found in anykernel.sh')

            patch = '''split_boot

        # S928B daily: remove forced CPUFreq governor policy.
        # This artifact is e3q-specific; do not rely on recovery properties.
        # Samsung PowerHAL/WALT selects the runtime governor after boot.
        patch_cmdline "cpufreq.default_governor" ""
        ui_print "  -> Removed forced CPUFreq default governor"

        # Android 14/6.1 GKI requires kasan_flag_enabled in its stable KMI.
        # Keep HW-tag KASAN compiled for ABI compatibility, but never run it.
        patch_cmdline "kasan" "off"
        ui_print "  -> KASAN HW-tags retained for GKI ABI; runtime disabled"
        '''
            text = text.replace(needle, patch, 1)
            path.write_text(text)

        kasan_cmdline = 'patch_cmdline "kasan" "off"'
        if kasan_cmdline not in text:
            needle = '''ui_print "  -> Removed forced CPUFreq default governor"
        '''
            if needle not in text:
                raise SystemExit('S928B governor block not found while adding KASAN fallback')
            replacement = '''ui_print "  -> Removed forced CPUFreq default governor"

        # Android 14/6.1 GKI requires kasan_flag_enabled in its stable KMI.
        # Keep HW-tag KASAN compiled for ABI compatibility, but never run it.
        patch_cmdline "kasan" "off"
        ui_print "  -> KASAN HW-tags retained for GKI ABI; runtime disabled"
        '''
            text = text.replace(needle, replacement, 1)
            path.write_text(text)

        required = [
            marker,
            'patch_cmdline "cpufreq.default_governor" ""',
            'patch_cmdline "kasan" "off"',
            'Samsung PowerHAL/WALT selects the runtime governor',
        ]
        missing = [item for item in required if item not in path.read_text()]
        if missing:
            raise SystemExit(f'AnyKernel governor patch verification failed: {missing}')
        PY

        grep -n -A7 -B2 'S928B daily' "$AK3"

    - name: Keep SUSFS logging switchable but default off
      run: |
        AK3="AnyKernel3/anykernel.sh"
        [ -f "$AK3" ] || { echo "::error::AnyKernel3 anykernel.sh not found"; exit 1; }

        python3 - "$AK3" <<'PY'
        from pathlib import Path
        import sys

        path = Path(sys.argv[1])
        text = path.read_text()
        marker = '# S928B daily: keep SUSFS logging runtime-switchable'

        if marker not in text:
            needle = '''ui_print "  -> Removed forced CPUFreq default governor"
        '''
            if needle not in text:
                raise SystemExit('S928B governor block not found in anykernel.sh')

            replacement = '''ui_print "  -> Removed forced CPUFreq default governor"

        # S928B daily: keep SUSFS logging runtime-switchable.
        # Start each installed build with logging disabled; users may later run
        # ksu_susfs enable_log 1 and disable it again with enable_log 0.
        if [ -d /data/adb ]; then
            SUSFS_CFG=/data/adb/susfs4ksu/config.sh
            mkdir -p /data/adb/susfs4ksu
            if [ -f "$SUSFS_CFG" ] && grep -q '^susfs_log=' "$SUSFS_CFG"; then
                sed -i 's/^susfs_log=.*/susfs_log=0/' "$SUSFS_CFG"
            else
                echo 'susfs_log=0' >> "$SUSFS_CFG"
            fi

            if [ -x /data/adb/ksu/bin/ksu_susfs ]; then
                /data/adb/ksu/bin/ksu_susfs enable_log 0 >/dev/null 2>&1 || true
            fi
            ui_print "  -> SUSFS logging default: off; runtime toggle retained"
        fi
        '''
            text = text.replace(needle, replacement, 1)
            path.write_text(text)

        required = [
            marker,
            "echo 'susfs_log=0'",
            'ksu_susfs enable_log 0',
            'runtime toggle retained',
        ]
        missing = [item for item in required if item not in path.read_text()]
        if missing:
            raise SystemExit(f'SUSFS logging default-off patch verification failed: {missing}')
        PY

        grep -n -A24 -B3 'keep SUSFS logging runtime-switchable' "$AK3"

    - name: Audit S928B AnyKernel policy
      run: |
        set -euo pipefail
        if grep -R -n -I 'performance' AnyKernel3; then
          echo "::error::AnyKernel3 still contains a forced performance policy"
          exit 1
        fi
        if grep -R -n -I 'cpufreq.default_governor=performance' AnyKernel3; then
          echo "::error::AnyKernel3 still contains the forbidden CPUFreq assignment"
          exit 1
        fi
        grep -R -n -I 'patch_cmdline "cpufreq.default_governor" ""' AnyKernel3
        grep -R -n -I 'patch_cmdline "kasan" "off"' AnyKernel3
        grep -R -n -I 'susfs_log=0' AnyKernel3

    - name: Clone Kernel Patches
      run: git clone https://github.com/WildKernels/kernel_patches.git --depth=1

    - name: Clone SukiSU Patch
      run: git clone https://github.com/ShirkNeko/SukiSU_patch.git --depth=1

    - name: Download Git Repo Tool
      run: |
        mkdir -p git-repo
        curl -L https://storage.googleapis.com/git-repo-downloads/repo -o git-repo/repo
        chmod 0755 git-repo/repo

    - name: Upload AnyKernel3
      uses: actions/upload-artifact@v7
      with:
        name: anykernel3
        path: AnyKernel3/
        retention-days: 1
        compression-level: 6

    - name: Upload Kernel Patches
      uses: actions/upload-artifact@v7
      with:
        name: kernel-patches
        path: kernel_patches/
        retention-days: 1
        compression-level: 6

    - name: Upload SukiSU Patch
      uses: actions/upload-artifact@v7
      with:
        name: sukisu-patch
        path: SukiSU_patch/
        retention-days: 1
        compression-level: 6

    - name: Upload Git Repo Tool
      uses: actions/upload-artifact@v7
      with:
        name: git-repo-tool
        path: git-repo/
        retention-days: 1
        compression-level: 0
