name: Prepare ReSukiSU 35139 branch

on:
  push:
    branches:
      - agent/resukisu-35139-susfs-230
    paths:
      - '.github/workflows/prepare-resukisu-35139.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/resukisu-35139-susfs-230
          fetch-depth: 0

      - name: Render exact 35139 file contents
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64

          old_version = '35137'
          new_version = '35139'
          old_commit = '3380d41f2043644d0ef6c0e0e91be6b229024d00'
          new_commit = '601f6d2af4801492339f74f622e1a4ae3a445250'

          top = Path('.github/workflows/run-resukisu-35057-strict.yml')
          top_text = top.read_text(encoding='utf-8')
          top_text = top_text.replace(old_commit, new_commit).replace(old_version, new_version)
          top_text = top_text.replace('4437 commits', '4439 commits')
          top_text = top_text.replace('Based on successful kernel run 34684249719',
                                      'Based on successful kernel run 34703196045')

          build = Path('.github/workflows/build-resukisu.yml')
          build_text = build.read_text(encoding='utf-8').replace(old_version, new_version)
          # 35139 is two manager-only commits ahead of 35137. Reuse the exact
          # validated kernel/SUSFS UAPI4 adapter and its existing test-output tag.
          build_text = build_text.replace('su-session-35139', 'su-session-35137')
          build_text = build_text.replace('session35139-*', 'session35137-*')

          verifier = Path('android14-6.1/build-helpers/verify-zeromount-susfs-source.sh')
          verifier_text = verifier.read_text(encoding='utf-8')
          old_gate = 'if [[ "${RESUKISU_VERSION_CODE:-}" == "35137" ]]; then'
          new_gate = 'if [[ "${RESUKISU_VERSION_CODE:-}" == "35137" || "${RESUKISU_VERSION_CODE:-}" == "35139" ]]; then'
          if old_gate not in verifier_text:
              raise SystemExit('35137 verifier gate not found')
          verifier_text = verifier_text.replace(old_gate, new_gate)

          for label, text in (
              ('TOP', top_text),
              ('BUILD', build_text),
              ('VERIFIER', verifier_text),
          ):
              data = base64.b64encode(text.encode()).decode()
              print(f'BEGIN_{label}_BASE64')
              print(data)
              print(f'END_{label}_BASE64')
          PY
