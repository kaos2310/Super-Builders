name: S928B SUSFS2.4 Module-Pakete
on:
  workflow_dispatch:
    inputs:
      component:
        description: Modul zum Erstellen
        type: choice
        options: [zeromount, resusfs]
        default: zeromount
permissions:
  contents: read
jobs:
  zeromount:
    if: inputs.component == 'zeromount'
    uses: ./.github/workflows/build-zeromount-41165-susfs240.yml
  resusfs:
    if: inputs.component == 'resusfs'
    uses: ./.github/workflows/build-resusfs-41165-susfs240.yml
