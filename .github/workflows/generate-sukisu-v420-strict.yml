name: Generate SukiSU Ultra v4.2.0 Strict Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - agent/sukisu-ultra-v4.2.0-susfs-2.3.0
    paths:
      - '.github/workflows/generate-sukisu-v420-strict.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout strict branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Repair SUSFS namei reconciliation and OverlayFS config
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          assemble = Path('android14-6.1/build-helpers/assemble-defconfig.sh')
          text = assemble.read_text(encoding='utf-8')
          old = '''  apply_targeted_patch "$COMMON_TREE" "$UPSTREAM_PATCH" \\
            'fs/namei.c' "$TARGETED_DIR/namei-open-redirect.patch" \\
            'CONFIG_KSU_SUSFS_OPEN_REDIRECT|AS_FLAGS_OPEN_REDIRECT|susfs_get_redirected_path'\n'''
          new = '''  # Enhanced SUSFS structurally rewrites parts of namei.c before config assembly.\n  # Therefore the official Open Redirect hunk set is not guaranteed to be\n  # byte-for-byte forward/reverse applicable as one patch unit. Treat this\n  # replay as recovery-only and let verify-susfs-v2.2-procfs.sh be the strict\n  # semantic gate immediately below. Missing functionality still fails closed.\n  apply_optional_targeted_patch "$COMMON_TREE" "$UPSTREAM_PATCH" \\
            'fs/namei.c' "$TARGETED_DIR/namei-open-redirect.patch" \\
            'CONFIG_KSU_SUSFS_OPEN_REDIRECT|AS_FLAGS_OPEN_REDIRECT|susfs_get_redirected_path'\n'''
          if old not in text:
              if 'replay as recovery-only' not in text:
                  raise SystemExit('assemble-defconfig.sh namei reconciliation anchor changed')
          else:
              text = text.replace(old, new, 1)
          assemble.write_text(text, encoding='utf-8')

          fragment = Path('android14-6.1/defconfig.fragment')
          cfg = fragment.read_text(encoding='utf-8')
          marker = '# [overlayfs]\n'
          if 'CONFIG_OVERLAY_FS=y\n' not in cfg:
              if cfg.count(marker) != 1:
                  raise SystemExit('overlayfs section anchor changed')
              cfg = cfg.replace(marker, marker + 'CONFIG_OVERLAY_FS=y\n', 1)
          fragment.write_text(cfg, encoding='utf-8')
          PY

          git diff --check
          grep -A7 '^# \[overlayfs\]$' android14-6.1/defconfig.fragment | grep -qx 'CONFIG_OVERLAY_FS=y'
          grep -qF 'apply_optional_targeted_patch "$COMMON_TREE" "$UPSTREAM_PATCH"' android14-6.1/build-helpers/assemble-defconfig.sh
          grep -qF 'let verify-susfs-v2.2-procfs.sh be the strict' android14-6.1/build-helpers/assemble-defconfig.sh
          grep -qF 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' android14-6.1/defconfig.fragment
          grep -qF 'CONFIG_KPM=y' android14-6.1/defconfig.fragment
          grep -qF 'CONFIG_ZEROMOUNT=y' android14-6.1/defconfig.fragment

      - name: Commit configure fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android14-6.1/build-helpers/assemble-defconfig.sh android14-6.1/defconfig.fragment
          if git diff --cached --quiet; then
            echo 'Configure fix already present.'
            exit 0
          fi
          git commit -m 'fix: reconcile SUSFS namei hooks semantically'
          git push origin HEAD:agent/sukisu-ultra-v4.2.0-susfs-2.3.0
