name: Generate SukiSU Ultra v4.2.0 Strict Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - agent/sukisu-ultra-v4.2.0-susfs-2.3.0
    paths:
      - '.github/workflows/generate-sukisu-v420-strict.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout strict branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Repair SUSFS namei reconciliation and OverlayFS config
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          assemble = Path('android14-6.1/build-helpers/assemble-defconfig.sh')
          lines = assemble.read_text(encoding='utf-8').splitlines(keepends=True)
          target = "'fs/namei.c' \"$TARGETED_DIR/namei-open-redirect.patch\""
          matches = [i for i, line in enumerate(lines) if target in line]
          if len(matches) != 1:
              raise SystemExit(f'expected one primary namei Open Redirect replay, found {len(matches)}')
          i = matches[0]
          call = None
          for j in range(i - 1, max(-1, i - 4), -1):
              if 'apply_targeted_patch "$COMMON_TREE" "$UPSTREAM_PATCH"' in lines[j]:
                  call = j
                  break
              if 'apply_optional_targeted_patch "$COMMON_TREE" "$UPSTREAM_PATCH"' in lines[j]:
                  call = j
                  break
          if call is None:
              raise SystemExit('primary namei replay call was not found')
          if 'apply_optional_targeted_patch' not in lines[call]:
              lines[call] = lines[call].replace('apply_targeted_patch', 'apply_optional_targeted_patch', 1)
              comments = [
                  '  # Enhanced SUSFS may structurally rewrite namei.c before config assembly.\n',
                  '  # Replay the official Open Redirect hunks as recovery-only; the strict\n',
                  '  # semantic verifier below still fails closed if functionality is missing.\n',
              ]
              lines[call:call] = comments
          assemble.write_text(''.join(lines), encoding='utf-8')

          fragment = Path('android14-6.1/defconfig.fragment')
          cfg = fragment.read_text(encoding='utf-8')
          marker = '# [overlayfs]\n'
          if 'CONFIG_OVERLAY_FS=y\n' not in cfg:
              if cfg.count(marker) != 1:
                  raise SystemExit('overlayfs section anchor changed')
              cfg = cfg.replace(marker, marker + 'CONFIG_OVERLAY_FS=y\n', 1)
          fragment.write_text(cfg, encoding='utf-8')
          PY

          git diff --check
          grep -A7 '^# \[overlayfs\]$' android14-6.1/defconfig.fragment | grep -qx 'CONFIG_OVERLAY_FS=y'
          python3 - <<'PY'
          from pathlib import Path
          text = Path('android14-6.1/build-helpers/assemble-defconfig.sh').read_text()
          target = "'fs/namei.c' \"$TARGETED_DIR/namei-open-redirect.patch\""
          lines = text.splitlines()
          i = next(i for i, line in enumerate(lines) if target in line)
          window = '\n'.join(lines[max(0, i-5):i+2])
          assert 'apply_optional_targeted_patch "$COMMON_TREE" "$UPSTREAM_PATCH"' in window
          assert 'strict semantic verifier' in window
          PY
          grep -qF 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' android14-6.1/defconfig.fragment
          grep -qF 'CONFIG_KPM=y' android14-6.1/defconfig.fragment
          grep -qF 'CONFIG_ZEROMOUNT=y' android14-6.1/defconfig.fragment

      - name: Commit configure fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android14-6.1/build-helpers/assemble-defconfig.sh android14-6.1/defconfig.fragment
          if git diff --cached --quiet; then
            echo 'Configure fix already present.'
            exit 0
          fi
          git commit -m 'fix: reconcile SUSFS namei hooks semantically'
          git push origin HEAD:agent/sukisu-ultra-v4.2.0-susfs-2.3.0
