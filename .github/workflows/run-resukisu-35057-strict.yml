permissions:
  contents: write
  actions: write

concurrency:
  group: s928b-resukisu-35154-zzi4-manual-hook-test-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  gunyah-preflight:
    name: Gunyah allocator and exact-C reclaim fault tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate transformation, budget bounds and exact C function
        run: |
          set -euo pipefail
          python3 android14-6.1/build-helpers/test-e3q-gunyah-adaptive-backing.py
          python3 android14-6.1/build-helpers/test-e3q-gunyah-reclaim.py

  userspace:
    needs: gunyah-preflight
    uses: ./.github/workflows/build-resukisu-userspace.yml
    with:
      resukisu_commit: 6ec8d9a8a8be30878c388504cacf8ae7849c757b
      resukisu_version_code: "35154"

  dependencies:
    needs: gunyah-preflight
    uses: ./.github/workflows/cache-dependencies.yml

  strict-gate:
    name: Full strict KMI gate / ReSukiSU 35154 Manual Hook / Gunyah RM MEM_APPEND + SCM-VMID
    needs: [dependencies, userspace]
    uses: ./.github/workflows/build-resukisu.yml
    permissions:
      contents: write
      actions: write
    with:
      android_version: android14
      kernel_version: "6.1"
      sub_level: "162"
      os_patch_level: "2026-03"
      add_susfs: false
      add_zeromount: false
      add_droidspaces: true
      add_zram: true
      add_bbg: true
      add_overlayfs_support: true
      add_kpm: false
      susfs_open_redirect: false
      susfs_su_session: false
      add_ptrace_fix: true
      add_perf_patches: true
      sukisu_commit: 6ec8d9a8a8be30878c388504cacf8ae7849c757b
      resukisu_source_branch: main
      resukisu_version_code: "35154"
      device_codename: e3q
      kmi_mode: strict
      kmi_profile: full-strict
      kmi_minimal_config: false
      package_strict_anykernel: true

# Exact base: successful run 35135374934 @ 03edc6bce8f8bb089d5249d1bfc93006609d3ce8.
# ReSukiSU 35154 = direct child 6ec8d9a8a8be30878c388504cacf8ae7849c757b of the 35153 pin.
# Diagnostic variant: KSU_MANUAL_HOOK=y. ReSukiSU exposes KSU_SUSFS as a mutually
# exclusive hook choice, so SUSFS/ZeroMount are intentionally disabled here to avoid
# a false Manual-Hook result. Droidspaces, ZRAM, BBG, performance patches, Samsung
# ZZI4 source port, strict KMI checks and Gunyah fixes remain aligned with the baseline.
