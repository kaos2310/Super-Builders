name: S928B ZZHL ReSukiSU 35119 Android17 Runtime Fixes v1 Build
run-name: "S928BXXU6ZZHL EUX — ReSukiSU 35119 + Android17 Runtime Fixes v1 + SUSFS Native v2"

on:
  workflow_dispatch:
  push:
    branches:
      - agent/resukisu-35115-eux-zzhl
      - agent/resukisu-35119-susfs-su-session-port
      - agent/resukisu-35119-susfs-native-v2
      - agent/resukisu-35119-android17-runtime-fixes-v1
    paths:
      - '.github/workflows/run-resukisu-35057-strict.yml'
      - '.github/workflows/build-resukisu.yml'
      - '.github/workflows/cache-dependencies.yml'
      - '.github/actions/susfs-v2.2/**'
      - 'android14-6.1/defconfig.fragment'
      - 'android14-6.1/build-helpers/clean-build-flags.sh'
      - 'android14-6.1/build-helpers/apply-e3q-cgroup-pids-compat.sh'
      - 'android14-6.1/build-helpers/apply-e3q-cmdline-governor-compat.sh'
      - 'android14-6.1/build-helpers/apply-e3q-gunyah-vm-metadata-allocation.sh'
      - 'android14-6.1/build-helpers/apply-e3q-gunyah-cma-compat.sh'
      - 'android14-6.1/build-helpers/patch-e3q-gunyah-adaptive-backing.py'
      - 'android14-6.1/build-helpers/test-e3q-gunyah-adaptive-backing.py'
      - 'android14-6.1/build-helpers/patch-e3q-gunyah-reclaim.py'
      - 'android14-6.1/build-helpers/test-e3q-gunyah-reclaim.py'
      - 'android14-6.1/build-helpers/gunyah-reclaim/**'
      - 'android14-6.1/build-helpers/su-session/**'
      - 'android14-6.1/build-helpers/apply-e3q-gunyah-qcom-vmid-compat.sh'
      - 'android14-6.1/build-helpers/allow-e3q-gunyah-rm-vmid-kmi.sh'
      - 'android14-6.1/build-helpers/audit-e3q-gunyah-qcom-module.sh'
      - 'android14-6.1/build-helpers/apply-s928b-zzhl-source-port.sh'
      - 'android14-6.1/build-helpers/verify-samsung-dlkm-crcs.sh'
      - 'android14-6.1/e3q-zzhl-gunyah-qcom-stock-modversions.tsv'
      - 'android14-6.1/samsung-e3q-zzhl-dlkm-crc-baseline.tsv'
      - 'android14-6.1/samsung-s928bxxu6zzhl-source.env'
      - 'android14-6.1/samsung-s928bxxu6zzhl-target.env'
      - 'android14-6.1/samsung-sm-s928b-17-zzhl-common-port.tar.xz'
      - 'device-profiles.json'
      - 'android14-6.1/build-helpers/configure-resukisu-release.sh'
      - 'android14-6.1/build-helpers/configure-susfs-log-default.sh'
      - 'android14-6.1/build-helpers/apply-enhanced-susfs-v2.2.sh'
      - 'android14-6.1/build-helpers/assemble-defconfig.sh'
      - 'android14-6.1/build-helpers/harden-resukisu-zeromount-kallsyms.sh'
      - 'android14-6.1/build-helpers/make-resukisu-umount-add-idempotent.sh'
      - 'android14-6.1/build-helpers/setup-bbg.sh'
      - 'android14-6.1/build-helpers/verify-susfs-v2.2-procfs.sh'
      - 'android14-6.1/build-helpers/verify-zeromount-susfs-source.sh'
      - 'android14-6.1/SukiSU-Ultra/patches/51_enhanced_susfs-android14-6.1.patch'
      - 'android14-6.1/SukiSU-Ultra/patches/60_zeromount-android14-6.1.patch'
      - 'android14-6.1/resukisu-pin.txt'

permissions:
  contents: write
  actions: write

concurrency:
  group: s928b-resukisu-35119-android17-runtime-fixes-v1-strict-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  gunyah-preflight:
    name: Gunyah allocator and exact-C reclaim fault tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate transformation, budget bounds and exact C function
        run: |
          set -euo pipefail
          python3 android14-6.1/build-helpers/test-e3q-gunyah-adaptive-backing.py
          python3 android14-6.1/build-helpers/test-e3q-gunyah-reclaim.py

  dependencies:
    needs: gunyah-preflight
    uses: ./.github/workflows/cache-dependencies.yml

  strict-gate:
    name: Full strict KMI gate / ReSukiSU 6.1.162 / Android17 runtime fixes / Gunyah RM MEM_APPEND + SCM-VMID
    needs: dependencies
    uses: ./.github/workflows/build-resukisu.yml
    permissions:
      contents: write
      actions: write
    with:
      android_version: android14
      kernel_version: "6.1"
      sub_level: "162"
      os_patch_level: "2026-03"
      add_susfs: true
      add_zeromount: true
      add_droidspaces: true
      add_zram: true
      add_bbg: true
      add_overlayfs_support: true
      add_kpm: false
      susfs_open_redirect: false
      susfs_su_session: true
      add_ptrace_fix: true
      add_perf_patches: true
      sukisu_commit: f1dd81dc96d7f3f6691e6ac8b50fba9ae8a2f17c
      resukisu_source_branch: main
      resukisu_version_code: "35119"
      device_codename: e3q
      kmi_mode: strict
      kmi_profile: full-strict
      kmi_minimal_config: false
      package_strict_anykernel: true

# 2026-09-09 Android 17 runtime compatibility:
# - Dynamic-manager GET remains available to the authenticated manager process;
#   SET/WIPE/SYNC remain root-only inside the ioctl handler.
# - Runtime sepolicy parser resolves target "self" to the source type.
# - Missing optional Samsung A17 nsfs policy type is treated as a no-op rule.
# ZeroMount and the pinned SUSFS v2.3.0 integration remain unchanged.
#
# 2026-08-22 runtime-safe e3q policy:
# retain the 8192-total-entry E2BIG safety guard as a circuit breaker for
# fragmented normal GuestMemory, while keeping the upstream 512-entry Gunyah
# RM MEM_APPEND batching path for valid parcels <= 8192 entries. Keep IRQFD
# edge/level compatibility, bounded backing, dynamic RM-VMID SCM mapping,
# additive gh_rm_get_vmid KMI allowance, safe contig teardown, and the audited
# vendor_boot-compatible gunyah_qcom.ko as a CI/live-test artifact.
