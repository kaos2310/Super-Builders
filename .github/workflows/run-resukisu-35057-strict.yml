permissions:
  contents: write
  actions: write

concurrency:
  group: s928b-resukisu-35137-susfs-native-uapi4-strict-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  gunyah-preflight:
    name: Gunyah allocator and exact-C reclaim fault tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate transformation, budget bounds and exact C function
        run: |
          set -euo pipefail
          python3 android14-6.1/build-helpers/test-e3q-gunyah-adaptive-backing.py
          python3 android14-6.1/build-helpers/test-e3q-gunyah-reclaim.py

  userspace:
    needs: gunyah-preflight
    uses: ./.github/workflows/build-resukisu-userspace.yml
    with:
      resukisu_commit: 3380d41f2043644d0ef6c0e0e91be6b229024d00
      resukisu_version_code: "35137"

  dependencies:
    needs: gunyah-preflight
    uses: ./.github/workflows/cache-dependencies.yml

  strict-gate:
    name: Full strict KMI gate / ReSukiSU 35137 UAPI4 Scoped Session v2 / Gunyah RM MEM_APPEND + SCM-VMID
    needs: [dependencies, userspace]
    uses: ./.github/workflows/build-resukisu.yml
    permissions:
      contents: write
      actions: write
    with:
      android_version: android14
      kernel_version: "6.1"
      sub_level: "162"
      os_patch_level: "2026-03"
      add_susfs: true
      add_zeromount: true
      add_droidspaces: true
      add_zram: true
      add_bbg: true
      add_overlayfs_support: true
      add_kpm: false
      susfs_open_redirect: false
      # Adapt the SUSFS 88792822 callback to native UAPI4, retaining the explicit
      # session decision and success guard from reference run 34262304602.
      # The legacy 35119/UAPI2 backport is not applicable to native UAPI4.
      susfs_su_session: false
      add_ptrace_fix: true
      add_perf_patches: true
      sukisu_commit: 3380d41f2043644d0ef6c0e0e91be6b229024d00
      resukisu_source_branch: main
      resukisu_version_code: "35137"
      device_codename: e3q
      kmi_mode: strict
      kmi_profile: full-strict
      kmi_minimal_config: false
      package_strict_anykernel: true

