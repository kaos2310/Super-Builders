name: S928B ZZI4 ReSukiSU 35154 SUSFS Inline + ZeroMount Test
run-name: "S928BXXU6ZZI4 EUX — ReSukiSU 35154 / SUSFS Inline Hook + ZeroMount / Gunyah Reclaim v1"

on:
  workflow_dispatch:
  push:
    branches:
      - agent/resukisu-35154-zzi4-susfs-inline-test

permissions:
  contents: write
  actions: write

concurrency:
  group: s928b-resukisu-35154-zzi4-susfs-inline-zeromount-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  gunyah-preflight:
    name: Gunyah allocator and exact-C reclaim fault tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate transformation, budget bounds and exact C function
        run: |
          set -euo pipefail
          python3 android14-6.1/build-helpers/test-e3q-gunyah-adaptive-backing.py
          python3 android14-6.1/build-helpers/test-e3q-gunyah-reclaim.py

  userspace:
    needs: gunyah-preflight
    uses: ./.github/workflows/build-resukisu-userspace.yml
    with:
      resukisu_commit: 6ec8d9a8a8be30878c388504cacf8ae7849c757b
      resukisu_version_code: "35154"

  dependencies:
    needs: gunyah-preflight
    uses: ./.github/workflows/cache-dependencies.yml

  strict-gate:
    name: Full strict KMI gate / ReSukiSU 35154 SUSFS Inline + ZeroMount / Gunyah RM MEM_APPEND + SCM-VMID
    needs: [dependencies, userspace]
    uses: ./.github/workflows/build-resukisu.yml
    permissions:
      contents: write
      actions: write
    with:
      android_version: android14
      kernel_version: "6.1"
      sub_level: "162"
      os_patch_level: "2026-03"
      add_susfs: true
      add_zeromount: true
      add_droidspaces: true
      add_zram: true
      add_bbg: true
      add_overlayfs_support: true
      add_kpm: false
      susfs_open_redirect: false
      susfs_su_session: false
      add_ptrace_fix: true
      add_perf_patches: true
      sukisu_commit: 6ec8d9a8a8be30878c388504cacf8ae7849c757b
      resukisu_source_branch: main
      resukisu_version_code: "35154"
      device_codename: e3q
      kmi_mode: strict
      kmi_profile: full-strict
      kmi_minimal_config: false
      package_strict_anykernel: true

# BUILD C based on successful run 35135374934 / ZZI4 kernel 6.1.162 baseline.
# Hook selection is explicit in android14-6.1/defconfig.fragment:
# KSU_TRACEPOINT_HOOK=n, KSU_MANUAL_HOOK=n, KSU_SUSFS=y.
# ZeroMount remains enabled to match the known-good production stack and strict KMI config.
# ReSukiSU 35154 pin: 6ec8d9a8a8be30878c388504cacf8ae7849c757b.
