name: S928B SukiSU Ultra 40901 KPM Gunyah RM-Append Build
run-name: "S928BXXS6DZG1 EUX — SukiSU Ultra 40901 + KPM + Gunyah RM MEM_APPEND / SCM-VMID"

on:
  workflow_dispatch:
  push:
    branches:
      - agent/resukisu-35057-eux-dzg1-cmdline
      - agent/avf-gunyah-memshare-guard
      - agent/sukisu-ultra-40901-native
    paths:
      - '.github/workflows/run-resukisu-35057-strict.yml'
      - '.github/workflows/build-resukisu.yml'
      - '.github/workflows/cache-dependencies.yml'
      - '.github/actions/susfs-v2.2/**'
      - 'android14-6.1/defconfig.fragment'
      - 'android14-6.1/build-helpers/clean-build-flags.sh'
      - 'android14-6.1/build-helpers/apply-e3q-cgroup-pids-compat.sh'
      - 'android14-6.1/build-helpers/apply-e3q-cmdline-governor-compat.sh'
      - 'android14-6.1/build-helpers/apply-e3q-gunyah-vm-metadata-allocation.sh'
      - 'android14-6.1/build-helpers/apply-e3q-gunyah-cma-compat.sh'
      - 'android14-6.1/build-helpers/apply-e3q-gunyah-qcom-vmid-compat.sh'
      - 'android14-6.1/build-helpers/allow-e3q-gunyah-rm-vmid-kmi.sh'
      - 'android14-6.1/build-helpers/audit-e3q-gunyah-qcom-module.sh'
      - 'android14-6.1/build-helpers/verify-samsung-dlkm-crcs.sh'
      - 'android14-6.1/e3q-gunyah-qcom-stock-modversions.tsv'
      - 'android14-6.1/build-helpers/configure-resukisu-release.sh'
      - 'android14-6.1/build-helpers/configure-sukisu-ultra-release.sh'
      - 'android14-6.1/build-helpers/prepare-sukisu-40901-susfs-port.sh'
      - 'android14-6.1/build-helpers/audit-sukisu-40901-susfs-rebase.sh'
      - 'android14-6.1/build-helpers/finalize-sukisu-40901-susfs-port.sh'
      - 'android14-6.1/build-helpers/verify-zeromount-susfs-source.sh'
      - 'android14-6.1/build-helpers/apply-enhanced-susfs-v2.2.sh'
      - 'android14-6.1/build-helpers/configure-susfs-log-default.sh'
      - 'android14-6.1/build-helpers/harden-resukisu-zeromount-kallsyms.sh'
      - 'android14-6.1/build-helpers/make-resukisu-umount-add-idempotent.sh'
      - 'android14-6.1/resukisu-pin.txt'

permissions:
  contents: write
  actions: write

concurrency:
  # Keep the previous group key so any intermediate conversion run is cancelled
  # when this final exact SukiSU Ultra configuration is pushed.
  group: s928b-resukisu-35113-exact-strict-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  dependencies:
    uses: ./.github/workflows/cache-dependencies.yml

  strict-gate:
    name: Full strict KMI gate / SukiSU Ultra 6.1.145 + KPM / Gunyah RM MEM_APPEND + SCM-VMID
    needs: dependencies
    uses: ./.github/workflows/build-resukisu.yml
    permissions:
      contents: write
      actions: write
    with:
      android_version: android14
      kernel_version: "6.1"
      sub_level: "145"
      os_patch_level: "2025-09"
      add_susfs: true
      add_zeromount: true
      add_droidspaces: true
      add_zram: true
      add_bbg: true
      add_overlayfs_support: true
      add_kpm: true
      susfs_open_redirect: false
      add_ptrace_fix: true
      add_perf_patches: true
      # The reusable workflow still bootstraps its KernelSU git metadata from
      # this immutable ReSukiSU commit. configure-resukisu-release.sh replaces
      # only the working tree with exact SukiSU Ultra 40901 source while keeping
      # that metadata stable for the existing strict pin checks.
      sukisu_commit: aa7c82a7f5b5f8693118854383d88d522bdcd0f1
      resukisu_source_branch: main
      resukisu_version_code: "40901"
      device_codename: e3q
      kmi_mode: strict
      kmi_profile: full-strict
      kmi_minimal_config: false
      package_strict_anykernel: true

# Exact root source compiled by this workflow:
#   SukiSU Ultra v4.2.0 / 40901
#   9fbe8fe8ca90c62c259c5894bf96d02ac31209b9
# KPM is mandatory for this build. The reusable workflow adds --kpm during
# defconfig assembly and the strict identity/config gate requires CONFIG_KPM=y.
# SUSFS is integrated through a SukiSU-specific ABI/lifecycle port. The generic
# upstream 10_enable_susfs_for_ksu.patch is audited but deliberately not applied,
# so SukiSU 40901 execveat, WebView/isolated-process umount and hook-manager
# semantics remain intact and are protected by the seven-file SHA gate.
# All non-root properties remain identical to successful run 33471532297.
# Runtime-safe e3q policy is retained: 8192-total-entry E2BIG guard, upstream
# 512-entry Gunyah RM MEM_APPEND batching, IRQFD edge/level compatibility,
# bounded backing, dynamic RM-VMID SCM mapping, additive gh_rm_get_vmid KMI
# allowance, safe contig teardown, and audited vendor_boot gunyah_qcom.ko.
