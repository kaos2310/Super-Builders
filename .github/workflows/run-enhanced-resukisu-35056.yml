name: Enhanced ReSukiSU v4.2.0-rc1-35080
run-name: "Enhanced ReSukiSU v4.2.0-rc1-35080 + Gunyah CMA experiment — 6.1.145-android14-11-33419968-abS928BXXS6DZG1"

on:
  workflow_dispatch:
  push:
    branches:
      - agent/kmi-runtime-compat
    paths:
      - '.github/workflows/run-enhanced-resukisu-35056.yml'
      - '.github/workflows/kernel-custom.yml'
      - '.github/workflows/build-resukisu.yml'
      - '.github/workflows/cache-dependencies.yml'
      - '.github/actions/susfs-v2.2/**'
      - '.github/actions/zeromount-v2.2/**'
      - '.github/actions/droidspaces-678/**'
      - 'android14-6.1/defconfig.fragment'
      - 'android14-6.1/build-helpers/**'
      - 'android14-6.1/samsung-e3q-dlkm-crc-baseline.tsv'
      - 'android14-6.1/SukiSU-Ultra/patches/**'
      - 'android14-6.1/resukisu-pin.txt'
      - 'device-profiles.json'
      - 'zram/**'

permissions:
  contents: write
  actions: write

concurrency:
  group: enhanced-resukisu-35056-e3q
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/kernel-custom.yml
    permissions:
      contents: write
      actions: write
    with:
      kernel_target: "android14-6.1.145 (2025-09)"
      quick_target: ""
      ksu_variant: "ReSukiSU"
      add_susfs: true
      add_zeromount: true
      add_droidspaces: true
      add_zram: true
      add_bbg: true
      add_overlayfs_support: true
      add_kpm: false
      susfs_open_redirect: true
      sukisu_commit: "9918a8dbf1647cfb21c5ba7c91905972b4f22488"
      resukisu_source_branch: "main"
      resukisu_version_code: "35080"

  official-manager:
    name: Official ReSukiSU Manager reference
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Publish original signed Manager artifacts
        env:
          OFFICIAL_CERT_SHA256: d3469712b6214462764a1d8d3e5cbe1d6819a0b629791b9f4101867821f1df64
          UPSTREAM_REPO: https://github.com/ReSukiSU/ReSukiSU
        run: |
          set -euo pipefail
          {
            echo "## ReSukiSU reference"
            echo ""
            echo "- Pinned kernel/manager source commit: \`9918a8dbf1647cfb21c5ba7c91905972b4f22488\`"
            echo "- Expected version code: \`35080\`"
            echo "- Official certificate SHA-256: \`${OFFICIAL_CERT_SHA256}\`"
            echo "- Upstream repository: ${UPSTREAM_REPO}"
            echo ""
            echo "This workflow does not re-sign a Manager APK."
          } >> "$GITHUB_STEP_SUMMARY"

# Gunyah CMA experimental build trigger: 2026-08-20
