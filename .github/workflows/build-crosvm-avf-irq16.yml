name: Build patched Android 17 crosvm (AVF Gunyah IRQFD)

on:
  workflow_dispatch:
  push:
    branches:
      - agent/avf-crosvm-android17
    paths:
      - '.github/workflows/build-crosvm-avf-irq16.yml'
      - 'scripts/patch-crosvm-gunyah-irqfd.py'
      - 'scripts/patch-crosvm-gunyah-irqfd-core.py'
      - 'scripts/patch-crosvm-gunyah-memory-contiguity.py'
      - 'scripts/patch-crosvm-gunyah-cma-base.py'
      - 'scripts/patch-crosvm-gunyah-cma-backport.py'
      - 'scripts/patch-crosvm-gunyah-init-trace.py'
      - 'scripts/prepare-crosvm-binder-deps.py'
      - 'scripts/test-crosvm-android17-preflight.py'

permissions:
  contents: read

jobs:
  build-crosvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      BUILD_VOLUME: /opt/aosp-build
      AOSP_DIR: /opt/aosp-build/aosp
      OUT_DIR: /opt/aosp-build/out
      AOSP_TAG: android-17.0.0_r1
      PATCH_FILE: /tmp/android-17.0.0_r1-gunyah-irqfd.patch

    steps:
      - name: Expand runner build volume
        uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794
        with:
          build-mount-path: /opt/aosp-build
          root-reserve-mb: 4096
          temp-reserve-mb: 256
          swap-size-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout Super-Builders
        uses: actions/checkout@v4

      - name: Test Android 17 provider preflight
        run: python3 scripts/test-crosvm-android17-preflight.py

      - name: Verify expanded runner storage
        shell: bash
        run: |
          set -euxo pipefail
          df -hT
          df -hT "$BUILD_VOLUME"
          mount | grep -F "$BUILD_VOLUME" || true
          test -d "$BUILD_VOLUME"
          test -w "$BUILD_VOLUME"
          sudo apt-get clean

      - name: Install repo tool
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/repo" version

      - name: Initialize Android 17 r1 manifest
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$AOSP_DIR" "$OUT_DIR"
          cd "$AOSP_DIR"
          repo init \
            -u https://android.googlesource.com/platform/manifest \
            -b "$AOSP_TAG" \
            --depth=1 \
            --partial-clone \
            --clone-filter=blob:none \
            --no-clone-bundle
          cp .repo/manifests/default.xml /tmp/aosp-manifest.xml
          test -s /tmp/aosp-manifest.xml

      - name: Sync minimal crosvm build source set
        shell: bash
        run: |
          set -euxo pipefail
          cd "$AOSP_DIR"

          python3 - <<'PY' > /tmp/crosvm-projects.txt
          import xml.etree.ElementTree as ET

          root = ET.parse('/tmp/aosp-manifest.xml').getroot()
          prefixes = (
              'bionic',
              'build/blueprint', 'build/make', 'build/soong', 'build/release',
              'external/crosvm', 'external/virtio-media',
              'external/rust/',
              'external/golang-protobuf', 'external/starlark-go',
              'external/go-cmp', 'external/pogreb',
              'external/abseil-cpp', 'external/error_prone', 'external/googletest',
              'external/sqlite', 'external/icu', 'external/jsoncpp', 'external/fmtlib',
              'external/minijail', 'external/libcap', 'external/libdrm',
              'external/expat', 'external/libffi',
              'external/libusb', 'external/libxml2', 'external/lz4',
              'external/perfetto', 'external/protobuf', 'external/boringssl', 'external/zlib',
              'external/wayland', 'external/wayland-protocols',
              'external/mesa3d',
              'frameworks/native',
              'hardware/google/gfxstream',
              'hardware/interfaces',
              'prebuilts/bazel/common',
              'prebuilts/build-tools', 'prebuilts/clang/host/linux-x86',
              'prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8',
              'prebuilts/devtools', 'prebuilts/go/linux-x86', 'prebuilts/jdk/jdk21',
              'prebuilts/misc', 'prebuilts/ndk', 'prebuilts/remoteexecution-client',
              'prebuilts/rust', 'prebuilts/sdk', 'prebuilts/siso', 'prebuilts/tools',
              'prebuilts/vndk',
              'toolchain/pgo-profiles',
              'system/core', 'system/libbase', 'system/logging',
              'system/sepolicy', 'system/tools/aidl', 'system/tools/hidl',
          )
          # Catch removed/renamed providers before spending time syncing sources.
          paths = [p.get('path') or p.get('name') or '' for p in root.findall('project')]
          unmatched = [x for x in prefixes if not any(
              path == x or path.startswith(x.rstrip('/') + '/') for path in paths
          )]
          if unmatched:
              raise SystemExit(f'source selectors absent from pinned manifest: {unmatched}')
          selected = []
          for p in root.findall('project'):
              path = p.get('path') or p.get('name') or ''
              if any(path == x or path.startswith(x.rstrip('/') + '/') for x in prefixes):
                  selected.append(p.get('name'))
          selected = sorted(set(x for x in selected if x))
          if not selected:
              raise SystemExit('minimal manifest selector matched zero projects')
          print('\n'.join(selected))
          PY

          echo "Selected $(wc -l < /tmp/crosvm-projects.txt) AOSP projects"
          cat /tmp/crosvm-projects.txt
          grep -q '^platform/external/crosvm$' /tmp/crosvm-projects.txt
          grep -q '^platform/external/virtio-media$' /tmp/crosvm-projects.txt
          grep -q '^platform/external/abseil-cpp$' /tmp/crosvm-projects.txt
          grep -q '^platform/external/error_prone$' /tmp/crosvm-projects.txt
          grep -q '^platform/external/googletest$' /tmp/crosvm-projects.txt
          grep -q '^platform/external/expat$' /tmp/crosvm-projects.txt
          grep -q '^platform/external/jsoncpp$' /tmp/crosvm-projects.txt
          grep -q '^platform/external/fmtlib$' /tmp/crosvm-projects.txt
          grep -q '^platform/external/lz4$' /tmp/crosvm-projects.txt
          grep -q '^platform/external/perfetto$' /tmp/crosvm-projects.txt
          grep -q '^platform/external/sqlite$' /tmp/crosvm-projects.txt
          grep -q '^platform/external/icu$' /tmp/crosvm-projects.txt
          grep -q '^platform/hardware/google/gfxstream$' /tmp/crosvm-projects.txt
          grep -q '^platform/prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8$' /tmp/crosvm-projects.txt
          grep -q '^platform/hardware/interfaces$' /tmp/crosvm-projects.txt
          grep -q '^platform/prebuilts/vndk/' /tmp/crosvm-projects.txt
          grep -q '^platform/prebuilts/siso$' /tmp/crosvm-projects.txt
          grep -q '^toolchain/pgo-profiles$' /tmp/crosvm-projects.txt
          grep -q '^platform/system/tools/aidl$' /tmp/crosvm-projects.txt
          grep -q '^platform/system/tools/hidl$' /tmp/crosvm-projects.txt
          if grep -q '^device/generic/' /tmp/crosvm-projects.txt; then
            echo 'ERROR: full generic-device product graph selected unexpectedly' >&2
            exit 1
          fi
          if grep -q '^platform/packages/modules/Virtualization$' /tmp/crosvm-projects.txt; then
            echo 'ERROR: AVF Java/product graph selected unexpectedly' >&2
            exit 1
          fi

          mapfile -t PROJECTS < /tmp/crosvm-projects.txt
          repo sync -c -j4 --no-tags --no-clone-bundle --force-sync "${PROJECTS[@]}"

          # Keep the complete graphics provider subtree from the initial checkout.
          # libui/libgui require legacy HIDL, stable-C IMapper and Stable AIDL
          # providers. Deleting these and restoring them later is intentionally
          # avoided so Soong always sees one coherent provider tree.
          python3 - <<'PY'
          import shutil
          from pathlib import Path

          def remove_path(path):
              if path.is_dir() and not path.is_symlink():
                  shutil.rmtree(path)
              else:
                  path.unlink()

          root = Path('hardware/interfaces')
          root_keep = {
              '.git', 'Android.bp', 'LICENSE', 'METADATA', 'NOTICE', 'OWNERS',
              'common', 'drm', 'graphics', 'media',
          }
          for child in list(root.iterdir()):
              if child.name not in root_keep:
                  remove_path(child)

          media = root / 'media'
          media_keep = {
              'Android.bp', 'LICENSE', 'METADATA', 'NOTICE', 'OWNERS', '1.0',
          }
          for child in list(media.iterdir()):
              if child.name not in media_keep:
                  remove_path(child)

          # Android 17 graphics/composer3 imports drm.common-V1, not the DRM HAL.
          drm = root / 'drm'
          drm_keep = {'Android.bp', 'LICENSE', 'METADATA', 'NOTICE', 'OWNERS', 'common'}
          for child in list(drm.iterdir()):
              if child.name not in drm_keep:
                  remove_path(child)
          PY

          test ! -e hardware/interfaces/compatibility_matrices
          test ! -e hardware/interfaces/audio
          test -d hardware/interfaces/common/aidl
          test -d hardware/interfaces/graphics/common/aidl
          test -f hardware/interfaces/graphics/mapper/stable-c/Android.bp
          grep -q 'name: "libimapper_stablec"' hardware/interfaces/graphics/mapper/stable-c/Android.bp
          grep -q 'name: "libimapper_providerutils"' hardware/interfaces/graphics/mapper/stable-c/Android.bp
          grep -q '"libarect_headers"' hardware/interfaces/graphics/mapper/stable-c/Android.bp
          grep -q '"libbase_headers"' hardware/interfaces/graphics/mapper/stable-c/Android.bp
          test -f frameworks/native/libs/arect/Android.bp
          grep -q 'name: "libarect_headers"' frameworks/native/libs/arect/Android.bp
          test -f system/libbase/Android.bp
          grep -q 'name: "libbase_headers"' system/libbase/Android.bp
          test -f hardware/interfaces/graphics/allocator/3.0/Android.bp
          test -f hardware/interfaces/graphics/allocator/4.0/Android.bp
          test -f hardware/interfaces/graphics/mapper/2.1/Android.bp
          test -f hardware/interfaces/graphics/mapper/3.0/Android.bp
          test -f hardware/interfaces/graphics/mapper/4.0/Android.bp
          test -f hardware/interfaces/graphics/allocator/aidl/Android.bp
          test -f hardware/interfaces/media/1.0/Android.bp

          echo '=== STORAGE AFTER MINIMAL SYNC ==='
          df -hT /
          df -hT "$BUILD_VOLUME"
          du -sh "$AOSP_DIR" "$OUT_DIR" 2>/dev/null || true

          test -d external/crosvm
          test -d build/soong
          test -d build/release
          test -d external/abseil-cpp
          grep -R -q 'name: "absl_notls_defaults"' external/abseil-cpp
          grep -R -q '"com.android.runtime"' external/abseil-cpp
          test -f external/error_prone/Android.bp
          test -f external/googletest/googletest/Android.bp
          grep -q 'name: "libgtest"' external/googletest/googletest/Android.bp
          grep -q 'name: "libgtest_prod_headers"' external/googletest/googletest/Android.bp
          grep -q 'host_supported: true' external/googletest/googletest/Android.bp
          test -f external/lz4/lib/Android.bp
          grep -q 'name: "liblz4"' external/lz4/lib/Android.bp
          test -f external/perfetto/include/perfetto/tracing.h
          grep -q 'name: "libperfetto_client_experimental"' external/perfetto/Android.bp
          grep -R -q 'name: "libsqlite"' external/sqlite
          grep -R -q 'name: "libicuuc"' external/icu
          grep -R -q 'name: "libicui18n"' external/icu
          test -f external/jsoncpp/Android.bp
          grep -q 'name: "libjsoncpp"' external/jsoncpp/Android.bp
          test -f external/fmtlib/Android.bp
          grep -q 'name: "fmtlib"' external/fmtlib/Android.bp
          test -f external/virtio-media/device/Android.bp
          grep -q 'name: "libvirtio_media"' external/virtio-media/device/Android.bp
          test -f external/rust/crates/v4l2r/lib/Android.bp
          grep -q 'name: "libv4l2r"' external/rust/crates/v4l2r/lib/Android.bp
          test -d external/rust/android-crates-io/crates
          grep -R -q 'name: "libenumn"' external/rust/android-crates-io/crates
          grep -R -q 'libvirtio_media' external/crosvm
          test -f prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8/sysroot/usr/include/stdlib.h
          test -f prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8/sysroot/usr/include/string.h
          test -f prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8/sysroot/usr/include/math.h
          test -d external/golang-protobuf/proto
          test -d external/starlark-go/starlark
          test -d external/go-cmp/cmp
          test -d external/pogreb
          test -f external/libxml2/Android.bp
          grep -q 'name: "xmllint"' external/libxml2/Android.bp
          test -x prebuilts/go/linux-x86/bin/go
          test -x prebuilts/jdk/jdk21/linux-x86/bin/java
          # Android 17 Soong defaults to Siso for both bootstrap and compilation.
          test -x prebuilts/siso/linux-x86/siso
          test -f build/soong/siso_config/main.star
          prebuilts/siso/linux-x86/siso version
          test -d prebuilts/rust
          find prebuilts/vndk -mindepth 1 -maxdepth 1 -type d -print -quit | grep -q .
          test -f toolchain/pgo-profiles/sampling/afdo_profiles.mk
          # android-17.0.0_r1 removed system/cros-codecs. The Android crosvm
          # Soong graph no longer consumes it (Cargo's optional VAAPI dep differs).
          if grep -R -E -i 'cros.?codecs' external/crosvm --include=Android.bp; then
            echo 'ERROR: cros-codecs returned to the Android build; update provider closure' >&2
            exit 1
          fi
          test -f hardware/interfaces/drm/common/aidl/Android.bp
          grep -q 'name: "android.hardware.drm.common"' hardware/interfaces/drm/common/aidl/Android.bp
          test -f hardware/interfaces/graphics/common/aidl/Android.bp

          python3 - <<'PY'
          from pathlib import Path

          bp = Path('hardware/interfaces/graphics/common/aidl/Android.bp')
          text = bp.read_text(encoding='utf-8')
          required = (
              'name: "android.hardware.graphics.common"',
              'host_supported: true',
              'frozen: true',
              'ndk: {',
              'version: "7"',
          )
          missing = [entry for entry in required if entry not in text]
          if missing:
              raise SystemExit(f'graphics common AIDL definition is incomplete: {missing}')

          api_root = bp.parent / 'aidl_api' / 'android.hardware.graphics.common'
          frozen_versions = sorted(
              int(path.name) for path in api_root.iterdir()
              if path.is_dir() and path.name.isdigit()
          )
          if not frozen_versions or frozen_versions[-1] != 7:
              raise SystemExit(f'expected frozen graphics common V7, got {frozen_versions}')
          if not (api_root / '7' / '.hash').is_file():
              raise SystemExit('missing frozen graphics common V7 hash')
          print('graphics common Stable AIDL frozen=V7')
          PY

          test -d system/tools/aidl/build
          grep -R -q 'RegisterModuleType("aidl_interface"' system/tools/aidl/build
          test -d system/tools/hidl/build
          grep -R -q 'RegisterModuleType("hidl_interface"' system/tools/hidl/build
          grep -R -q 'RegisterModuleType("hidl_package_root"' system/tools/hidl/build

          # Stub only missing ownership-team metadata in this partial checkout.
          rm -rf local-missing-teams
          mkdir -p local-missing-teams
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          ref_re = re.compile(r'\b(?:team|default_team)\s*:\s*"(?P<name>trendy_team_[^"]+)"')
          name_re = re.compile(r'\bname\s*:\s*"(?P<name>trendy_team_[^"]+)"')
          refs, defs = set(), set()
          for base, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in {'.repo', 'out', 'local-missing-teams'}]
              if 'Android.bp' not in files:
                  continue
              bp = Path(base) / 'Android.bp'
              text = bp.read_text(encoding='utf-8', errors='ignore')
              refs.update(m.group('name') for m in ref_re.finditer(text))
              defs.update(m.group('name') for m in name_re.finditer(text))
          missing = sorted(refs - defs)
          out = Path('local-missing-teams/Android.bp')
          with out.open('w', encoding='utf-8') as f:
              f.write('// Generated ownership-only team stubs.\n\n')
              for name in missing:
                  f.write('team {\n')
                  f.write(f'    name: "{name}",\n')
                  f.write(f'    trendy_team_id: "{name}",\n')
                  f.write('}\n\n')
          print(f'Generated {len(missing)} missing trendy team stub(s)')
          PY
          test -s local-missing-teams/Android.bp

      - name: Verify exact crosvm source revision
        shell: bash
        run: |
          set -euxo pipefail
          cd "$AOSP_DIR/external/crosvm"
          echo "crosvm HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "c7dd8d6950912fa5e6fde7ec2d1616e0ddc090f8"
          grep -q 'const AARCH64_IRQ_BASE: u32 = 4;' aarch64/src/lib.rs
          grep -q 'const AARCH64_VMWDT_IRQ: u32 = 15;' aarch64/src/lib.rs
          grep -n 'pub fn register_irqfd' hypervisor/src/gunyah/mod.rs

      - name: Apply Samsung Gunyah dynamic-VM patch chain
        shell: bash
        run: |
          set -euxo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/patch-crosvm-gunyah-irqfd.py" "$AOSP_DIR/external/crosvm"
          cd "$AOSP_DIR/external/crosvm"
          grep -q 'reserve_irq(AARCH64_VMWDT_IRQ)' aarch64/src/lib.rs
          grep -q 'GUNYAH IRQFD add:' hypervisor/src/gunyah/mod.rs
          grep -q 'GUNYAH IRQFD add failed:' hypervisor/src/gunyah/mod.rs
          grep -q 'GH_ANDROID_CREATE_CMA_COMPAT_MEM_FD' hypervisor/src/gunyah/gunyah_sys.rs
          grep -q 'create_cma_compat_mem_fd' hypervisor/src/gunyah/mod.rs
          grep -q 'GUNYAH CMA: bounded guest backing SUCCESS' src/crosvm/sys/linux.rs
          grep -q 'fragmented normal GuestMemory fallback disabled' src/crosvm/sys/linux.rs
          grep -q 'GUNYAH INIT: GH_VM_START begin' hypervisor/src/gunyah/aarch64.rs
          grep -q 'GUNYAH INIT: GH_VM_START FAILED errno=' hypervisor/src/gunyah/aarch64.rs
          grep -q 'avf-final-dtb' aarch64/src/fdt.rs
          git diff --check
          git diff --stat
          git diff --binary > "$PATCH_FILE"
          test -s "$PATCH_FILE"

      - name: Build ARM64 Android crosvm
        shell: bash
        run: |
          set -euxo pipefail
          cd "$AOSP_DIR"
          export OUT_DIR="$OUT_DIR"
          export ENVSETUP_NO_COMPLETION=1
          export ALLOW_MISSING_DEPENDENCIES=true
          set +u
          source build/envsetup.sh
          lunch module_arm64 trunk_staging eng
          test "$TARGET_PRODUCT" = module_arm64

          APEX_STUB=android-17-crosvm-build-stubs/apexsupport/Android.bp
          test -f "$APEX_STUB"
          grep -Fq 'system_shared_libs: ["libc"]' "$APEX_STUB"
          grep -Fq 'installable: false' "$APEX_STUB"

          echo '=== BUILD GATE: crosvm with transitive Binder/libapexsupport closure ==='
          m -j2 crosvm
          set -u
          echo '=== STORAGE AFTER BUILD ==='
          df -hT "$BUILD_VOLUME"
          du -sh "$OUT_DIR" 2>/dev/null || true

      - name: Collect and validate crosvm binary
        shell: bash
        run: |
          set -euxo pipefail
          cd "$AOSP_DIR"
          DEST="$GITHUB_WORKSPACE/artifacts/crosvm-avf-gunyah-android17"
          mkdir -p "$DEST"

          mapfile -t CANDIDATES < <(
            {
              find "$OUT_DIR/target/product" \
                -type f -path '*/system/bin/crosvm' -perm -111 \
                2>/dev/null || true

              find "$OUT_DIR/soong/.intermediates/external/crosvm" \
                -type f -name crosvm -perm -111 \
                2>/dev/null || true
            } | awk '!seen[$0]++'
          )

          echo '=== crosvm candidates ==='
          printf '%s\n' "${CANDIDATES[@]}"

          CROSVM=""
          for candidate in "${CANDIDATES[@]}"; do
            [ -f "$candidate" ] || continue
            desc="$(file -b "$candidate" 2>/dev/null || true)"
            printf '%s -> %s\n' "$candidate" "$desc"

            if grep -Eqi 'ARM aarch64|ARM64|AArch64' <<<"$desc"; then
              CROSVM="$candidate"
              if [[ "$candidate" == */system/bin/crosvm ]]; then
                break
              fi
            fi
          done

          if [ -z "$CROSVM" ]; then
            echo 'ERROR: no Android ARM64 crosvm binary found' >&2
            echo '=== all possible crosvm outputs ===' >&2
            find "$OUT_DIR" -type f -name crosvm -print 2>/dev/null | head -200 >&2 || true
            exit 1
          fi

          echo "Selected crosvm: $CROSVM"
          test -f "$CROSVM"
          file "$CROSVM" | tee "$DEST/file.txt"
          file "$CROSVM" | grep -Eqi 'ARM aarch64|ARM64|AArch64'
          sha256sum "$CROSVM" | tee "$DEST/sha256.txt"
          readelf -h "$CROSVM" | tee "$DEST/readelf-header.txt"
          readelf -n "$CROSVM" | tee "$DEST/readelf-notes.txt" || true
          readelf -d "$CROSVM" | tee "$DEST/readelf-dynamic.txt"
          readelf -Ws "$CROSVM" | tee "$DEST/readelf-symbols.txt"
          grep 'NEEDED' "$DEST/readelf-dynamic.txt" \
            | tee "$DEST/dt-needed.txt" || true
          awk '$7 == "UND" {print}' "$DEST/readelf-symbols.txt" \
            | tee "$DEST/undefined-dynamic-symbols.txt"

          strings "$CROSVM" | grep -F 'GUNYAH CMA: bounded guest backing SUCCESS' >/dev/null
          strings "$CROSVM" | grep -F 'fragmented normal GuestMemory fallback disabled' >/dev/null
          strings "$CROSVM" | grep -F 'GUNYAH INIT: GH_VM_START begin' >/dev/null
          strings "$CROSVM" | grep -F 'GUNYAH INIT: GH_VM_START FAILED errno=' >/dev/null
          strings "$CROSVM" | grep -F 'GUNYAH IRQFD add: label=' >/dev/null
          {
            echo 'GUNYAH CMA: bounded guest backing SUCCESS'
            echo 'fragmented normal GuestMemory fallback disabled'
            echo 'GUNYAH INIT: GH_VM_START begin'
            echo 'GUNYAH INIT: GH_VM_START FAILED errno='
            echo 'GUNYAH IRQFD add: label='
          } > "$DEST/verified-binary-markers.txt"

          {
            echo 'Binary not executed during CI.'
            echo 'Target architecture: Android ARM64/AArch64'
            echo 'Runtime version must be checked on the target device.'
          } > "$DEST/version.txt"
          cp -a "$CROSVM" "$DEST/crosvm"
          cp "$PATCH_FILE" "$DEST/"
          PATCH_BASENAME="$(basename "$PATCH_FILE")"
          for helper in \
            patch-crosvm-gunyah-irqfd.py \
            patch-crosvm-gunyah-irqfd-core.py \
            patch-crosvm-gunyah-memory-contiguity.py \
            patch-crosvm-gunyah-cma-base.py \
            patch-crosvm-gunyah-cma-backport.py \
            patch-crosvm-gunyah-init-trace.py \
            prepare-crosvm-binder-deps.py; do
            cp "$GITHUB_WORKSPACE/scripts/$helper" "$DEST/"
          done
          sha256sum \
            "$DEST/$PATCH_BASENAME" \
            "$DEST/patch-crosvm-gunyah-"*.py \
            "$DEST/prepare-crosvm-binder-deps.py" \
            > "$DEST/patch-chain-sha256.txt"
          cat > "$DEST/build-info.txt" <<EOF
          AOSP_TAG=$AOSP_TAG
          CROSVM_SOURCE_COMMIT=$(cd external/crosvm && git rev-parse HEAD)
          PATCH=IRQ15_IRQFD_PLUS_SAMSUNG_CMA_COMPAT_UAPI_FAIL_CLOSED_PLUS_GUNYAH_INIT_TRACE
          PATCH_METHOD=FAIL_CLOSED_SOURCE_ANCHOR_CHAIN
          SAMSUNG_CMA_COMPAT_IOCTL=0x40084120
          SAMSUNG_CMA_COMPAT_MAX_BYTES=268435456
          SAMSUNG_GUNYAH_DEVICE=/dev/gunyah
          TARGET=module_arm64-trunk_staging-eng
          OUT_DIR=$OUT_DIR
          SOURCE_BINARY=$CROSVM
          EOF
          ls -lh "$DEST"

      - name: Upload patched crosvm artifact
        uses: actions/upload-artifact@v4
        with:
          name: crosvm-android17-r1-gunyah-irqfd-arm64
          path: artifacts/crosvm-avf-gunyah-android17/
          if-no-files-found: error
          retention-days: 14
