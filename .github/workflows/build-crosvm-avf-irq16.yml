name: Build patched Android 16 crosvm (AVF Gunyah IRQ16)

on:
  workflow_dispatch:
  push:
    branches:
      - avf-crosvm-irq16
    paths:
      - '.github/workflows/build-crosvm-avf-irq16.yml'
      - 'patches/crosvm/android-16.0.0_r4-gunyah-irq16.patch'

permissions:
  contents: read

jobs:
  build-crosvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      AOSP_DIR: ${{ github.workspace }}/aosp
      AOSP_TAG: android-16.0.0_r4
      PATCH_FILE: ${{ github.workspace }}/patches/crosvm/android-16.0.0_r4-gunyah-irq16.patch

    steps:
      - name: Checkout Super-Builders
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      - name: Install repo tool
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/repo" version

      - name: Initialize Android 16 r4 source tree
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$AOSP_DIR"
          cd "$AOSP_DIR"
          repo init \
            -u https://android.googlesource.com/platform/manifest \
            -b "$AOSP_TAG" \
            --depth=1 \
            --partial-clone \
            --clone-filter=blob:limit=10M \
            --no-clone-bundle

      - name: Sync Android source
        shell: bash
        run: |
          set -euxo pipefail
          cd "$AOSP_DIR"
          repo sync -c -j4 --no-tags --no-clone-bundle --force-sync
          df -h /

      - name: Verify exact crosvm source revision
        shell: bash
        run: |
          set -euxo pipefail
          cd "$AOSP_DIR/external/crosvm"
          echo "crosvm HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "738b7016fc50d6eadc94c8ca28022ad7c21f798d"
          grep -n -E 'AARCH64_IRQ_BASE|AARCH64_VMWDT_IRQ' aarch64/src/lib.rs
          grep -q 'const AARCH64_IRQ_BASE: u32 = 4;' aarch64/src/lib.rs
          grep -q 'const AARCH64_VMWDT_IRQ: u32 = 15;' aarch64/src/lib.rs

      - name: Apply IRQ16 patch
        shell: bash
        run: |
          set -euxo pipefail
          cd "$AOSP_DIR/external/crosvm"
          git apply --check "$PATCH_FILE"
          git apply "$PATCH_FILE"
          grep -n -E 'AARCH64_IRQ_BASE|AARCH64_VMWDT_IRQ' aarch64/src/lib.rs
          grep -q 'const AARCH64_IRQ_BASE: u32 = 16;' aarch64/src/lib.rs
          ! grep -q 'const AARCH64_IRQ_BASE: u32 = 4;' aarch64/src/lib.rs
          git diff --check
          git diff -- aarch64/src/lib.rs

      - name: Build ARM64 Android crosvm
        shell: bash
        run: |
          set -euxo pipefail
          cd "$AOSP_DIR"
          source build/envsetup.sh
          lunch aosp_arm64-eng
          m -j2 crosvm

      - name: Collect and validate crosvm binary
        shell: bash
        run: |
          set -euxo pipefail
          cd "$AOSP_DIR"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/crosvm-avf-irq16"

          CANDIDATES="$(find out/target/product -type f -name crosvm -perm -111 2>/dev/null || true)"
          printf '%s\n' "$CANDIDATES"
          CROSVM="$(printf '%s\n' "$CANDIDATES" | grep '/system/bin/crosvm$' | head -n1 || true)"
          if [ -z "$CROSVM" ]; then
            CROSVM="$(printf '%s\n' "$CANDIDATES" | head -n1)"
          fi
          test -n "$CROSVM"
          test -f "$CROSVM"

          file "$CROSVM"
          file "$CROSVM" | grep -qi 'ARM aarch64\|ARM64'
          "$CROSVM" version 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/crosvm-avf-irq16/version.txt" || true
          sha256sum "$CROSVM" | tee "$GITHUB_WORKSPACE/artifacts/crosvm-avf-irq16/sha256.txt"
          readelf -n "$CROSVM" | tee "$GITHUB_WORKSPACE/artifacts/crosvm-avf-irq16/readelf-notes.txt" || true
          cp -a "$CROSVM" "$GITHUB_WORKSPACE/artifacts/crosvm-avf-irq16/crosvm"
          cp "$PATCH_FILE" "$GITHUB_WORKSPACE/artifacts/crosvm-avf-irq16/"

          cat > "$GITHUB_WORKSPACE/artifacts/crosvm-avf-irq16/build-info.txt" <<EOF
          AOSP_TAG=$AOSP_TAG
          CROSVM_SOURCE_COMMIT=$(cd external/crosvm && git rev-parse HEAD)
          PATCH=AARCH64_IRQ_BASE_4_TO_16
          TARGET=aosp_arm64-eng
          SOURCE_BINARY=$CROSVM
          EOF

          ls -lh "$GITHUB_WORKSPACE/artifacts/crosvm-avf-irq16"

      - name: Upload patched crosvm artifact
        uses: actions/upload-artifact@v4
        with:
          name: crosvm-android16-r4-gunyah-irq16-arm64
          path: artifacts/crosvm-avf-irq16/
          if-no-files-found: error
          retention-days: 14
