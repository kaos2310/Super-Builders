name: Build ReSukiSU Manager

permissions:
  contents: read
  actions: write

on:
  workflow_call:
    inputs:
      source_branch:
        type: string
        required: true
      source_commit:
        type: string
        required: true
      version_code:
        type: string
        required: true
      expected_cert_size:
        type: string
        required: true
      expected_cert_hash:
        type: string
        required: true
    secrets:
      manager_keystore:
        required: true
      manager_keystore_password:
        required: true
      manager_key_password:
        required: true

jobs:
  build:
    name: "Manager v4.1.0-${{ inputs.version_code }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ReSukiSU/manager
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v6
        with:
          path: Super-Builders

      - name: Checkout pinned ReSukiSU main
        uses: actions/checkout@v6
        with:
          repository: ReSukiSU/ReSukiSU
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          path: ReSukiSU

      - name: Configure matching ReSukiSU release identity
        working-directory: ${{ github.workspace }}
        run: |
          git -C ReSukiSU fetch origin \
            "${{ inputs.source_branch }}:refs/remotes/origin/${{ inputs.source_branch }}"
          bash Super-Builders/android14-6.1/build-helpers/configure-resukisu-release.sh \
            ReSukiSU \
            "${{ inputs.source_branch }}" \
            "${{ inputs.source_commit }}" \
            "${{ inputs.version_code }}" \
            "${{ inputs.expected_cert_size }}" \
            "${{ inputs.expected_cert_hash }}"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install paired manager signing key
        env:
          MANAGER_KEYSTORE: ${{ secrets.manager_keystore }}
          MANAGER_KEYSTORE_PASSWORD: ${{ secrets.manager_keystore_password }}
          MANAGER_KEY_PASSWORD: ${{ secrets.manager_key_password }}
          EXPECTED_CERT_SIZE: ${{ inputs.expected_cert_size }}
          EXPECTED_CERT_HASH: ${{ inputs.expected_cert_hash }}
        run: |
          printf '%s' "$MANAGER_KEYSTORE" | base64 -d > key.jks
          {
            echo "KEYSTORE_PASSWORD=$MANAGER_KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=resukisu-build"
            echo "KEY_PASSWORD=$MANAGER_KEY_PASSWORD"
            echo "KEYSTORE_FILE=key.jks"
          } >> gradle.properties

          keytool -exportcert \
            -alias resukisu-build \
            -keystore key.jks \
            -storepass "$MANAGER_KEYSTORE_PASSWORD" \
            -file manager-cert.der
          ACTUAL_SIZE=$(printf '0x%04x' "$(stat -c%s manager-cert.der)")
          ACTUAL_HASH=$(sha256sum manager-cert.der | awk '{print $1}')
          test "$ACTUAL_SIZE" = "$EXPECTED_CERT_SIZE"
          test "$ACTUAL_HASH" = "$EXPECTED_CERT_HASH"
          echo "Paired manager certificate: size=$ACTUAL_SIZE sha256=$ACTUAL_HASH"

      - name: Build release APK
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -Pcommit="$SOURCE_COMMIT"

      - name: Audit release APK
        env:
          EXPECTED_VERSION_CODE: ${{ inputs.version_code }}
          EXPECTED_CERT_HASH: ${{ inputs.expected_cert_hash }}
        run: |
          set -euo pipefail
          METADATA=app/build/outputs/apk/release/output-metadata.json
          test -s "$METADATA"
          jq -e --argjson code "$EXPECTED_VERSION_CODE" \
            '.elements[] | select(.versionCode == $code and .versionName == "v4.1.0")' \
            "$METADATA" >/dev/null

          OUTPUT_FILE=$(jq -r --argjson code "$EXPECTED_VERSION_CODE" \
            '.elements[] | select(.versionCode == $code and (.filters | length) == 0) | .outputFile' \
            "$METADATA" | head -n1)
          test -n "$OUTPUT_FILE"
          APK="app/build/outputs/apk/release/$OUTPUT_FILE"
          test -s "$APK"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          test -x "$APKSIGNER"
          SIGNATURE_REPORT=$($APKSIGNER verify --verbose --print-certs "$APK")
          echo "$SIGNATURE_REPORT"
          grep -Fq 'Verified using v1 scheme (JAR signing): false' <<< "$SIGNATURE_REPORT"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' <<< "$SIGNATURE_REPORT"
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): false' <<< "$SIGNATURE_REPORT"
          grep -Fiq "certificate SHA-256 digest: $EXPECTED_CERT_HASH" <<< "$SIGNATURE_REPORT"

          mkdir -p dist
          FINAL_APK="dist/ReSukiSU_v4.1.0_${EXPECTED_VERSION_CODE}_Manager-universal.apk"
          cp "$APK" "$FINAL_APK"
          zipinfo -1 "$FINAL_APK" | grep -q '^AndroidManifest.xml$'
          zipinfo -1 "$FINAL_APK" | grep -q '^lib/arm64-v8a/libkernelsu.so$'
          sha256sum "$FINAL_APK"

      - name: Upload Manager APK
        uses: actions/upload-artifact@v7
        with:
          name: ReSukiSU-v4.1.0-${{ inputs.version_code }}-Manager-APK
          path: ReSukiSU/manager/dist/*.apk
          if-no-files-found: error
          compression-level: 9
