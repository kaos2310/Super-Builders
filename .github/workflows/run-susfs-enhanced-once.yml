name: Run Enhanced SukiSU SUSFS Once

on:
  push:
    branches:
      - agent/susfs-2.2.0
    paths:
      - .github/workflows/run-susfs-enhanced-once.yml

permissions:
  contents: write
  actions: write

jobs:
  build:
    uses: ./.github/workflows/kernel-custom.yml
    permissions:
      contents: write
      actions: write
    with:
      kernel_target: "android14-6.1.145 (2025-09)"
      quick_target: ""
      ksu_variant: "SukiSU"
      add_susfs: true
      add_zeromount: true
      add_droidspaces: true
      add_zram: true
      add_bbg: true
      add_overlayfs_support: true
      add_kpm: true
      susfs_open_redirect: true
      sukisu_commit: ""
# Trigger: validate SUSFS v2.2.0 init hunk filter (2026-07-29)
