name: Enhanced ReSukiSU v4.1.0-35046
run-name: "Enhanced ReSukiSU v4.1.0-35046 + Manager — 6.1.145-android14-11-33419968-abS928BXXS6DZG1"

on:
  workflow_dispatch:
  push:
    branches:
      - agent/resukisu-v4.1.0-35045
    paths:
      - '.github/workflows/run-enhanced-resukisu-35045.yml'
      - '.github/workflows/kernel-custom.yml'
      - '.github/workflows/build-resukisu.yml'
      - '.github/workflows/build-resukisu-manager.yml'
      - '.github/workflows/cache-dependencies.yml'
      - '.github/actions/susfs-v2.2/**'
      - '.github/actions/zeromount-v2.2/**'
      - '.github/actions/droidspaces-678/**'
      - 'android14-6.1/defconfig.fragment'
      - 'android14-6.1/build-helpers/**'
      - 'android14-6.1/SukiSU-Ultra/patches/**'
      - 'android14-6.1/resukisu-pin.txt'
      - 'device-profiles.json'
      - 'zram/**'

permissions:
  contents: write
  actions: write

concurrency:
  group: enhanced-resukisu-35046-e3q
  cancel-in-progress: true

jobs:
  manager-key:
    name: Generate paired Manager key
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      expected_size: ${{ steps.key.outputs.expected_size }}
      expected_hash: ${{ steps.key.outputs.expected_hash }}
      keystore: ${{ steps.key.outputs.keystore }}
      keystore_password: ${{ steps.key.outputs.keystore_password }}
      key_password: ${{ steps.key.outputs.key_password }}
    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Generate signing key and certificate identity
        id: key
        run: |
          KEYSTORE_PASSWORD=$(openssl rand -hex 32)
          KEY_PASSWORD=$(openssl rand -hex 32)
          keytool -genkeypair \
            -alias resukisu-build \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=ReSukiSU 35046 Paired Build" \
            -storetype JKS \
            -keystore manager-key.jks
          keytool -exportcert \
            -alias resukisu-build \
            -keystore manager-key.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -file manager-cert.der

          CERT_SIZE=$(printf '0x%04x' "$(stat -c%s manager-cert.der)")
          CERT_HASH=$(sha256sum manager-cert.der | awk '{print $1}')
          {
            echo "expected_size=$CERT_SIZE"
            echo "expected_hash=$CERT_HASH"
            echo "keystore=$(base64 -w0 manager-key.jks)"
            echo "keystore_password=$KEYSTORE_PASSWORD"
            echo "key_password=$KEY_PASSWORD"
          } >> "$GITHUB_OUTPUT"
          echo "Paired manager certificate: size=$CERT_SIZE sha256=$CERT_HASH"

  build:
    needs: manager-key
    uses: ./.github/workflows/kernel-custom.yml
    permissions:
      contents: write
      actions: write
    with:
      kernel_target: "android14-6.1.145 (2025-09)"
      quick_target: ""
      ksu_variant: "ReSukiSU"
      add_susfs: true
      add_zeromount: true
      add_droidspaces: true
      add_zram: true
      add_bbg: true
      add_overlayfs_support: true
      # ReSukiSU removed KPM upstream in faac3098; current main cannot provide it.
      add_kpm: false
      susfs_open_redirect: true
      sukisu_commit: "59c99fdf1735c37681ff18c7ffd7834741dcccbf"
      resukisu_source_branch: "main"
      resukisu_version_code: "35046"
      resukisu_expected_size: ${{ needs.manager-key.outputs.expected_size }}
      resukisu_expected_hash: ${{ needs.manager-key.outputs.expected_hash }}

  manager:
    needs: manager-key
    uses: ./.github/workflows/build-resukisu-manager.yml
    permissions:
      contents: read
      actions: write
    with:
      source_branch: "main"
      source_commit: "59c99fdf1735c37681ff18c7ffd7834741dcccbf"
      version_code: "35046"
      expected_cert_size: ${{ needs.manager-key.outputs.expected_size }}
      expected_cert_hash: ${{ needs.manager-key.outputs.expected_hash }}
    secrets:
      manager_keystore: ${{ needs.manager-key.outputs.keystore }}
      manager_keystore_password: ${{ needs.manager-key.outputs.keystore_password }}
      manager_key_password: ${{ needs.manager-key.outputs.key_password }}
