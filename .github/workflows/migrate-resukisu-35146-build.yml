name: Prepare ReSukiSU 35146 build workflow blob

on:
  push:
    branches:
      - agent/resukisu-35146-susfs-230
    paths:
      - '.github/workflows/migrate-resukisu-35146-build.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/resukisu-35146-susfs-230
          fetch-depth: 0
      - name: Validate and create remote 35146 workflow blob
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE=.github/workflows/build-resukisu.yml
          PAYLOAD="$RUNNER_TEMP/resukisu-35146-blob.json"
          python3 - "$FILE" "$PAYLOAD" <<'PY'
          from pathlib import Path
          import json
          import sys

          path = Path(sys.argv[1])
          payload = Path(sys.argv[2])
          text = path.read_text(encoding="utf-8")
          expected = (
              'default: "35140"',
              'Test ReSukiSU 35140 and latest SUSFS with exact C fault injection',
              "inputs.resukisu_version_code == '35140'",
              'ReSukiSU-35140-SUSFS-88792822-UAPI4',
              'Verify ReSukiSU 35140 compiled integration and attest package',
          )
          for marker in expected:
              if marker not in text:
                  raise SystemExit(f"missing expected 35140 build-gate marker: {marker}")

          updated = text.replace("35140", "35146")
          required = (
              'default: "35146"',
              'Test ReSukiSU 35146 and latest SUSFS with exact C fault injection',
              "inputs.resukisu_version_code == '35146'",
              'ReSukiSU-35146-SUSFS-88792822-UAPI4',
              'Verify ReSukiSU 35146 compiled integration and attest package',
          )
          for marker in required:
              if marker not in updated:
                  raise SystemExit(f"missing migrated 35146 build-gate marker: {marker}")
          if "35140" in updated:
              raise SystemExit("stale 35140 marker survived build workflow migration")

          path.write_text(updated, encoding="utf-8", newline="\n")
          payload.write_text(json.dumps({"content": updated, "encoding": "utf-8"}), encoding="utf-8")
          PY

          git diff --check -- "$FILE"
          git diff -- "$FILE"

          RESPONSE=$(curl --silent --show-error --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/blobs" \
            --data-binary "@$PAYLOAD")
          BLOB_SHA=$(jq -r '.sha // empty' <<<"$RESPONSE")
          [[ "$BLOB_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::GitHub did not return a valid blob SHA"
            echo "$RESPONSE"
            exit 1
          }
          echo "REMOTE_BLOB_SHA=$BLOB_SHA"
