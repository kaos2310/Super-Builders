name: ReSuSFS SUSFS2.4.0 Runtime1 r2 SukiSU41165
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Verify retained ReSuSFS behavior and new feature gates
        run: |
          set -euo pipefail
          python3 -B android14-6.1/build-helpers/resusfs-41165-240/test.py
          node android14-6.1/build-helpers/resusfs-41165-240/test.mjs
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - name: Build private official SUSFS2.4.0 tool and runtime helper
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          mkdir -p module-output
          python3 -B android14-6.1/build-helpers/resusfs-41165-240/build_tool.py --ndk "$ANDROID_NDK_ROOT" --output module-output/ksu_susfs
          CLANG="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          "$CLANG" --target=aarch64-linux-android26 -Os -nostdlib -static -fno-builtin -fno-stack-protector -fno-unwind-tables -fno-asynchronous-unwind-tables -Wl,-e,_start -Wl,--build-id=none -Wl,-z,max-page-size=16384 android14-6.1/build-helpers/susfs-runtime-41165/susfs-runtime.c -o module-output/susfs-runtime
          readelf -h module-output/ksu_susfs | grep -q AArch64
          readelf -h module-output/susfs-runtime | grep -q AArch64
      - name: Package ReSuSFS without replacing global tools or saved configuration
        run: |
          set -euo pipefail
          python3 -B android14-6.1/build-helpers/resusfs-41165-240/package.py --runtime-helper module-output/susfs-runtime --susfs-tool module-output/ksu_susfs --output module-output
          python3 -B android14-6.1/build-helpers/resusfs-41165-240/test_package.py module-output/ReSuSFS-v26.10.23-KAOSLAB-SUSFS2.4.0-Runtime1-r2-SukiSU41165-arm64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ReSuSFS-SUSFS2.4.0-Runtime1-r2-SukiSU41165-ARM64
          path: module-output/
          if-no-files-found: error
          retention-days: 30
