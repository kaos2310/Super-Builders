name: BakaSU 35262 / EZJB / SUSFS 2.4.0

on:
  push:
    branches: [codex/bakasu-35262-ezjb]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: bakasu-35262-ezjb-${{ github.ref }}
  cancel-in-progress: true

env:
  HELPER: build-center/bakasu-ezjb
  VERIFIED_KERNEL_RUN: '44914827133'
  VERIFIED_KERNEL_COMMIT: a50838ebec247cdeb26d81e3ec788850e4186605

jobs:
  kernel:
    name: EZJB ThinLTO and Samsung Strict KMI
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Resolve unchanged kernel build inputs
        id: kernel-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reuse=false
          # A companion-only change can retain a successful hosted kernel build.
          # Any change to a kernel input, build, audit or packer triggers compilation.
          if git diff --quiet "$VERIFIED_KERNEL_COMMIT" HEAD -- \
              "$HELPER" ':(exclude)build-center/bakasu-ezjb/pack_resusfs.py' \
              ':(exclude)build-center/bakasu-ezjb/test_resusfs_baka.py' \
              ':(exclude)build-center/bakasu-ezjb/verify_imported_kernel.py' \
              build-center/ci/firmware/ezj1/strict-baseline.tsv; then
            check=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_KERNEL_RUN/jobs" \
              --jq '.jobs[] | select(.name == "EZJB ThinLTO and Samsung Strict KMI") | .conclusion')
            head=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_KERNEL_RUN" --jq .head_sha)
            ready=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_KERNEL_RUN/artifacts" \
              --jq '[.artifacts[] | select(.name == "BakaSU-35262-EZJB-Strict-AnyKernel3" and .expired == false)] | length')
            if [[ "$check" == success && "$head" == "$VERIFIED_KERNEL_COMMIT" && "$ready" == 1 ]]; then
              reuse=true
            fi
          fi
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        if: steps.kernel-source.outputs.reuse == 'true'
        with:
          name: BakaSU-35262-EZJB-Strict-AnyKernel3
          path: dist
          run-id: ${{ env.VERIFIED_KERNEL_RUN }}
          github-token: ${{ github.token }}
      - name: Validate reused runner kernel artifact
        if: steps.kernel-source.outputs.reuse == 'true'
        run: python3 -B "$HELPER/verify_imported_kernel.py" dist/*-AnyKernel3.zip
      - name: Install kernel build dependencies
        if: steps.kernel-source.outputs.reuse != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y bison flex bc cpio libelf-dev libssl-dev libdw-dev dwarves zstd xz-utils
      - name: Build pinned ARM64 kernel and verify CRCs
        if: steps.kernel-source.outputs.reuse != 'true'
        run: bash "$HELPER/build.sh" "$RUNNER_TEMP/ezjb-kernel"
      - name: Package EZJB AnyKernel3
        if: steps.kernel-source.outputs.reuse != 'true'
        run: |
          bash "$HELPER/reference-assets.sh" "$RUNNER_TEMP/template" kernel
          python3 -B "$HELPER/bundle.py" kernel "$RUNNER_TEMP/template" "$RUNNER_TEMP/ezjb-kernel" dist
      - uses: actions/upload-artifact@v7
        with:
          name: BakaSU-35262-EZJB-Strict-AnyKernel3
          path: dist/*.zip
          if-no-files-found: error

  modules:
    name: BakaSU ZeroMount and ReSuSFS ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare pinned Android NDK and ARM64 test execution
        run: |
          sudo apt-get update -q
          sudo apt-get install -y qemu-user-static binfmt-support
          sudo update-binfmts --enable qemu-aarch64
          ndk="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          if [[ ! -d "$ndk/toolchains/llvm" ]]; then
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'ndk;29.0.14206865'
          fi
          echo "NDK_CLANG=$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" >> "$GITHUB_ENV"
      - name: Build ARM64 SUSFS tools and modules from checked inputs
        run: |
          bash "$HELPER/reference-assets.sh" "$RUNNER_TEMP/template" modules
          python3 -B "$HELPER/bundle.py" modules "$RUNNER_TEMP/template" "$RUNNER_TEMP/tools" dist --clang "$NDK_CLANG"
      - name: Verify actual ZIP installers and prop-watch
        run: |
          fixture="$RUNNER_TEMP/prop-watch-fixture"
          "$NDK_CLANG" --target=aarch64-linux-android26 -nostdlib -static -Wl,-e,_start "$HELPER/prop_watch_fixture.S" -o "$fixture"
          python3 -B "$HELPER/test_prop_watch.py" "$RUNNER_TEMP/template/zeromount.zip" dist/ZeroMount-*.zip "$fixture"
          python3 -B "$HELPER/test_zero_install.py" dist/ZeroMount-*.zip
          python3 -B "$HELPER/test_resusfs_baka.py" dist/ReSuSFS-*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: BakaSU-35262-EZJB-ZeroMount-ReSuSFS
          path: dist/*.zip
          if-no-files-found: error

  bundle:
    name: Assemble all EZJB build artifacts
    needs: [kernel, modules]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: BakaSU-35262-EZJB-*
          merge-multiple: true
          path: dist
      - name: Verify the three final packages
        run: |
          cd dist
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 3
          for archive in *.zip; do unzip -tq "$archive"; done
          sha256sum -- *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: S928BXXU6EZJB-BakaSU-35262-SUSFS-2.4.0-complete
          path: dist/*
          if-no-files-found: error
