name: SukiSU Build Center
run-name: SukiSU 41178 EZJ1 · ${{ inputs.request_id || 'pinned preview' }} · latest SUSFS
'on':
  schedule:
  - cron: 17 * * * *
  workflow_dispatch:
    inputs:
      channel:
        description: Explizit gepinnter SukiSU-41178-Vorschauauftrag
        type: choice
        options:
        - main
        default: main
      force:
        description: Auch bei vorhandenem Ergebnis neu bauen
        type: boolean
        default: false
      request_id:
        description: Zuordnung zum App-Auftrag
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: build-center-${{ github.repository }}-s928b-ezj1-41178-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  resolve:
    name: Offizielle Quellen und neue Versionen prüfen
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.resolve.outputs.build }}
      plan: ${{ steps.resolve.outputs.plan }}
      code: ${{ steps.resolve.outputs.code }}
      count: ${{ steps.resolve.outputs.count }}
      pin: ${{ steps.resolve.outputs.pin }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Beide Quellen auf unveränderliche Commits auflösen
      id: resolve
      env:
        GH_TOKEN: ${{ github.token }}
        CHANNEL: ${{ inputs.channel || 'main' }}
        FORCE: ${{ inputs.force || false }}
      run: |
        set -euo pipefail
        ARGS=(--channel "$CHANNEL")
        ARGS+=(--sukisu-ref 1c9cca42f8049227d4eea20ab3979db3c5662a7d)
        [[ "$FORCE" != true ]] || ARGS+=(--force)
        python3 build-center/ci/check_updates.py "${ARGS[@]}"
    - uses: actions/upload-artifact@v7
      if: steps.resolve.outputs.plan != ''
      with:
        name: Build-Center-Plan-${{ steps.resolve.outputs.pair }}
        path: build-plan.json
        if-no-files-found: error
        retention-days: 30
  dependencies:
    name: Cache Dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        persist-credentials: false
        repository: kaos2310/Super-Builders
        ref: f269b2d31779901efe920c3c8a3f00838e35e119
    - name: Checkout Build Center controller
      uses: actions/checkout@v6
      with:
        path: .build-center
        persist-credentials: false
    - name: Prepare immutable update candidate
      env:
        CENTER_PLAN: ${{ needs.resolve.outputs.plan }}
      run: python3 "$GITHUB_WORKSPACE/.build-center/build-center/ci/bootstrap.py" .
    - name: Clone AnyKernel3
      run: |
        set -euo pipefail
        ANYKERNEL3_PIN=e1e9dce98430c5c6f231f7094a8c7f4ecaf50948
        git init AnyKernel3
        git -C AnyKernel3 remote add origin https://github.com/WildKernels/AnyKernel3.git
        git -C AnyKernel3 fetch --depth=1 origin "$ANYKERNEL3_PIN"
        git -C AnyKernel3 checkout --detach FETCH_HEAD
        test "$(git -C AnyKernel3 rev-parse HEAD)" = "$ANYKERNEL3_PIN"
        echo "Pinned WildKernels/AnyKernel3 to $ANYKERNEL3_PIN"
        rm -rf AnyKernel3/.git
    - name: Harden S928B kernel command line
      run: |
        AK3="AnyKernel3/anykernel.sh"
        [ -f "$AK3" ] || { echo "::error::AnyKernel3 anykernel.sh not found"; exit 1; }

        python3 - "$AK3" <<'PY'
        from pathlib import Path
        import sys

        path = Path(sys.argv[1])
        text = path.read_text()
        marker = '# S928B daily: remove forced CPUFreq governor policy'

        properties = {
            'do.devicecheck=0\n': 'do.devicecheck=1\n',
            'device.name1=\n': 'device.name1=e3q\n',
            'device.name2=\n': 'device.name2=e3qxeea\n',
        }
        for original, replacement in properties.items():
            if original not in text and replacement not in text:
                raise SystemExit(f'AnyKernel property not found: {original}')
            text = text.replace(original, replacement, 1)

        if marker not in text:
            needle = 'split_boot\n'
            if needle not in text:
                raise SystemExit('split_boot call not found in anykernel.sh')

            patch = '''split_boot

        # Remove invalid standalone values left by older S928B AnyKernel ZIPs.
        # Android GKI bootconfig lives in vendor_boot and is deliberately not
        # modified here; this helper only edits the boot image kernel cmdline.
        s928b_pda=$(getprop ro.build.PDA 2>/dev/null || true)
        s928b_csc=$(getprop ro.csc.sales_code 2>/dev/null || true)
        [ -z "$s928b_pda" ] || [ "$s928b_pda" = "S928BXXS6EZJ1" ] || \
            abort "  -> Requires firmware S928BXXS6EZJ1; found $s928b_pda"
        [ -z "$s928b_csc" ] || [ "$s928b_csc" = "EUX" ] || \
            abort "  -> Requires EUX CSC; found $s928b_csc"
        ui_print "  -> Firmware target S928BXXS6EZJ1 (EUX)"

        sanitize_s928b_cmdline() {
            local cmdfile header_mode=0
            if [ -f "$SPLITIMG/cmdline.txt" ]; then
                cmdfile="$SPLITIMG/cmdline.txt"
            else
                cmdfile="$AKHOME/cmdtmp"
                header_mode=1
                grep "^cmdline=" "$SPLITIMG/header" | cut -d= -f2- > "$cmdfile"
            fi
            awk '{
                output = ""
                for (i = 1; i <= NF; i++) {
                    if ($i != "off" && $i != "4M")
                        output = output (output ? " " : "") $i
                }
                print output
            }' "$cmdfile" > "$cmdfile.clean"
            mv -f "$cmdfile.clean" "$cmdfile"
            if [ "$header_mode" = 1 ]; then
                sed -i "s|^cmdline=.*|cmdline=$(cat "$cmdfile")|" "$SPLITIMG/header"
                rm -f "$cmdfile"
            fi
        }
        sanitize_s928b_cmdline
        ui_print "  -> Removed invalid standalone off/4M cmdline tokens"

        # S928B daily: remove forced CPUFreq governor policy.
        # This artifact is e3q-specific; do not rely on recovery properties.
        # Samsung PowerHAL/WALT selects the runtime governor after boot.
        patch_cmdline "cpufreq.default_governor=" ""
        ui_print "  -> Removed forced CPUFreq default governor"

        # Do not preserve Samsung's explicit KPTI disable. With
        # CONFIG_UNMAP_KERNEL_AT_EL0=y the kernel selects its safe default.
        patch_cmdline "kpti=" ""
        ui_print "  -> Removed explicit kpti=0 override"

        # KASAN is compiled out; retain cmdline cleanup for older boot images.
        # kasan_flag_enabled is supplied by an inactive ABI-compatible stub.
        patch_cmdline "kasan=" "kasan=off"
        ui_print "  -> KASAN compiled out; inactive GKI KMI stub retained"
        '''
            text = text.replace(needle, patch, 1)
            path.write_text(text)

        kasan_cmdline = 'patch_cmdline "kasan=" "kasan=off"'
        if kasan_cmdline not in text:
            needle = '''ui_print "  -> Removed forced CPUFreq default governor"
        '''
            if needle not in text:
                raise SystemExit('S928B governor block not found while adding KASAN cmdline cleanup')
            replacement = '''ui_print "  -> Removed forced CPUFreq default governor"

        # KASAN is compiled out; retain cmdline cleanup for older boot images.
        # kasan_flag_enabled is supplied by an inactive ABI-compatible stub.
        patch_cmdline "kasan=" "kasan=off"
        ui_print "  -> KASAN compiled out; inactive GKI KMI stub retained"
        '''
            text = text.replace(needle, replacement, 1)
            path.write_text(text)

        kpti_cmdline = 'patch_cmdline "kpti=" ""'
        if kpti_cmdline not in text:
            needle = '''ui_print "  -> Removed forced CPUFreq default governor"
        '''
            if needle not in text:
                raise SystemExit('S928B governor block not found while adding KPTI hardening')
            replacement = '''ui_print "  -> Removed forced CPUFreq default governor"

        # Do not preserve Samsung's explicit KPTI disable. With
        # CONFIG_UNMAP_KERNEL_AT_EL0=y the kernel selects its safe default.
        patch_cmdline "kpti=" ""
        ui_print "  -> Removed explicit kpti=0 override"
        '''
            text = text.replace(needle, replacement, 1)
            path.write_text(text)

        required = [
            marker,
            'do.devicecheck=1',
            'device.name1=e3q',
            'device.name2=e3qxeea',
            'Requires firmware S928BXXS6EZJ1',
            'Requires EUX CSC',
            'sanitize_s928b_cmdline',
            'patch_cmdline "cpufreq.default_governor=" ""',
            'patch_cmdline "kpti=" ""',
            'patch_cmdline "kasan=" "kasan=off"',
            'Samsung PowerHAL/WALT selects the runtime governor',
        ]
        missing = [item for item in required if item not in path.read_text()]
        if missing:
            raise SystemExit(f'AnyKernel governor patch verification failed: {missing}')
        PY

        grep -n -A7 -B2 'S928B daily' "$AK3"
    - name: Keep SUSFS logging switchable but default off
      run: |
        AK3="AnyKernel3/anykernel.sh"
        [ -f "$AK3" ] || { echo "::error::AnyKernel3 anykernel.sh not found"; exit 1; }

        python3 - "$AK3" <<'PY'
        from pathlib import Path
        import sys

        path = Path(sys.argv[1])
        text = path.read_text()
        marker = '# S928B daily: keep SUSFS logging runtime-switchable'

        if marker not in text:
            needle = '''ui_print "  -> Removed forced CPUFreq default governor"
        '''
            if needle not in text:
                raise SystemExit('S928B governor block not found in anykernel.sh')

            replacement = '''ui_print "  -> Removed forced CPUFreq default governor"

        # S928B daily: keep SUSFS logging runtime-switchable and use exactly one
        # persistent controller. If SUSFS4KSU is installed it owns runtime
        # policy; ReSukiSU's native JSON stays disabled so it cannot overwrite
        # the module later in boot. Mount hiding stays off for Droidspaces.
        if [ -d /data/adb ]; then
            SUSFS_CFG=/data/adb/susfs4ksu/config.sh
            NATIVE_SUSFS_JSON=/data/adb/ksu/.susfs.json
            ZEROMOUNT_CFG=/data/adb/zeromount/config.toml
            EXTERNAL_SUSFS=0

            set_shell_value() {
                cfg_file="$1"
                cfg_key="$2"
                cfg_value="$3"
                if grep -q "^${cfg_key}=" "$cfg_file"; then
                    sed -i "s/^${cfg_key}=.*/${cfg_key}=${cfg_value}/" "$cfg_file"
                else
                    echo "${cfg_key}=${cfg_value}" >> "$cfg_file"
                fi
            }
            set_json_bool() {
                cfg_file="$1"
                cfg_key="$2"
                cfg_value="$3"
                dq='"'
                sed -i "s/${dq}${cfg_key}${dq}[[:space:]]*:[[:space:]]*[a-z]*/${dq}${cfg_key}${dq}: ${cfg_value}/" "$cfg_file"
            }
            set_toml_bool() {
                cfg_file="$1"
                cfg_key="$2"
                cfg_value="$3"
                if grep -q "^${cfg_key}[[:space:]]*=" "$cfg_file"; then
                    sed -i "s/^${cfg_key}[[:space:]]*=.*/${cfg_key} = ${cfg_value}/" "$cfg_file"
                fi
            }

            if [ -d /data/adb/modules/susfs4ksu ] || [ -f "$SUSFS_CFG" ]; then
                EXTERNAL_SUSFS=1
                mkdir -p /data/adb/susfs4ksu
                touch "$SUSFS_CFG"
                # Persistent module policy: susfs_log=0, avc_log_spoofing=1.
                set_shell_value "$SUSFS_CFG" susfs_log 0
                set_shell_value "$SUSFS_CFG" avc_log_spoofing 1
                set_shell_value "$SUSFS_CFG" hide_sus_mnts_for_all_or_non_su_procs 0
            fi

            if [ -f "$NATIVE_SUSFS_JSON" ]; then
                if [ "$EXTERNAL_SUSFS" = 1 ]; then
                    set_json_bool "$NATIVE_SUSFS_JSON" enabled false
                else
                    set_json_bool "$NATIVE_SUSFS_JSON" enabled true
                fi
                set_json_bool "$NATIVE_SUSFS_JSON" logging false
                set_json_bool "$NATIVE_SUSFS_JSON" avc_log_spoofing true
                set_json_bool "$NATIVE_SUSFS_JSON" hide_sus_mnts_for_non_su_procs false
            fi

            if [ -f "$ZEROMOUNT_CFG" ]; then
                set_toml_bool "$ZEROMOUNT_CFG" avc_log_spoofing true
                set_toml_bool "$ZEROMOUNT_CFG" hide_sus_mounts false
                set_toml_bool "$ZEROMOUNT_CFG" hide_sus_mounts_off_after_boot false
            fi

            if [ -x /data/adb/ksu/bin/ksu_susfs ]; then
                /data/adb/ksu/bin/ksu_susfs enable_log 0 >/dev/null 2>&1 || true
            fi
            ui_print "  -> SUSFS logging off; AVC spoofing on; Droidspaces mount hiding off"
        fi
        '''
            text = text.replace(needle, replacement, 1)
            path.write_text(text)

        required = [
            marker,
            'set_shell_value "$SUSFS_CFG" susfs_log 0',
            'set_shell_value "$SUSFS_CFG" avc_log_spoofing 1',
            'hide_sus_mnts_for_all_or_non_su_procs 0',
            'set_json_bool "$NATIVE_SUSFS_JSON" enabled false',
            'set_json_bool "$NATIVE_SUSFS_JSON" avc_log_spoofing true',
            'set_toml_bool "$ZEROMOUNT_CFG" hide_sus_mounts false',
            'ksu_susfs enable_log 0',
            'AVC spoofing on; Droidspaces mount hiding off',
        ]
        missing = [item for item in required if item not in path.read_text()]
        if missing:
            raise SystemExit(f'SUSFS logging default-off patch verification failed: {missing}')
        PY

        grep -n -A24 -B3 'keep SUSFS logging runtime-switchable' "$AK3"
    - name: Audit S928B AnyKernel policy
      run: |
        set -euo pipefail
        if grep -R -n -I 'performance' AnyKernel3; then
          echo "::error::AnyKernel3 still contains a forced performance policy"
          exit 1
        fi
        if grep -R -n -I 'cpufreq.default_governor=performance' AnyKernel3; then
          echo "::error::AnyKernel3 still contains the forbidden CPUFreq assignment"
          exit 1
        fi
        if grep -R -n -I 'patch_cmdline "kpti=" "kpti=0"' AnyKernel3; then
          echo "::error::AnyKernel3 still forces kpti=0"
          exit 1
        fi
        if grep -R -n -I -E 'patch_cmdline "[^"]+" "(off|4M)"' AnyKernel3; then
          echo "::error::AnyKernel3 contains a bare replacement value that corrupts cmdline"
          exit 1
        fi
        grep -R -n -I 'patch_cmdline "cpufreq.default_governor=" ""' AnyKernel3
        grep -R -n -I 'patch_cmdline "kpti=" ""' AnyKernel3
        grep -R -n -I 'patch_cmdline "kasan=" "kasan=off"' AnyKernel3
        grep -qxF 'do.devicecheck=1' AnyKernel3/anykernel.sh
        grep -qxF 'device.name1=e3q' AnyKernel3/anykernel.sh
        grep -qxF 'device.name2=e3qxeea' AnyKernel3/anykernel.sh
        grep -qF 'Requires firmware S928BXXS6EZJ1' AnyKernel3/anykernel.sh
        grep -qF 'Requires EUX CSC' AnyKernel3/anykernel.sh
        python3 android14-6.1/build-helpers/audit-s928b-anykernel-cmdline.py AnyKernel3
        grep -R -n -I 'susfs_log=0' AnyKernel3
        grep -R -n -I 'avc_log_spoofing 1' AnyKernel3
        grep -R -n -I 'hide_sus_mnts_for_all_or_non_su_procs 0' AnyKernel3
        grep -R -n -I 'set_json_bool "$NATIVE_SUSFS_JSON" enabled false' AnyKernel3
        grep -R -n -I 'set_toml_bool "$ZEROMOUNT_CFG" hide_sus_mounts false' AnyKernel3
    - name: Clone pinned Kernel Patches
      run: |
        KERNEL_PATCHES_PIN=ef2fff764581f30d066ad77bf9a311cbbec82da9
        git init kernel_patches
        git -C kernel_patches remote add origin https://github.com/WildKernels/kernel_patches.git
        git -C kernel_patches fetch --depth=1 origin "$KERNEL_PATCHES_PIN"
        git -C kernel_patches checkout --detach FETCH_HEAD
        test "$(git -C kernel_patches rev-parse HEAD)" = "$KERNEL_PATCHES_PIN"
        echo "Pinned WildKernels/kernel_patches to $KERNEL_PATCHES_PIN"
    - name: Clone SukiSU Patch
      run: git clone https://github.com/ShirkNeko/SukiSU_patch.git --depth=1
    - name: Download Git Repo Tool
      run: |
        mkdir -p git-repo
        curl -L https://storage.googleapis.com/git-repo-downloads/repo -o git-repo/repo
        chmod 0755 git-repo/repo
    - name: Upload AnyKernel3
      uses: actions/upload-artifact@v7
      with:
        name: anykernel3
        path: AnyKernel3/
        retention-days: 1
        compression-level: 6
    - name: Upload Kernel Patches
      uses: actions/upload-artifact@v7
      with:
        name: kernel-patches
        path: kernel_patches/
        retention-days: 1
        compression-level: 6
    - name: Upload SukiSU Patch
      uses: actions/upload-artifact@v7
      with:
        name: sukisu-patch
        path: SukiSU_patch/
        retention-days: 1
        compression-level: 6
    - name: Upload Git Repo Tool
      uses: actions/upload-artifact@v7
      with:
        name: git-repo-tool
        path: git-repo/
        retention-days: 1
        compression-level: 0
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    permissions:
      contents: read
      actions: write
  userspace:
    name: SukiSU${{ needs.resolve.outputs.code }} ksud + ksuinit / native UAPI6 / ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
    steps:
    - uses: actions/checkout@v6
      with:
        path: builder
        repository: kaos2310/Super-Builders
        ref: f269b2d31779901efe920c3c8a3f00838e35e119
        persist-credentials: false
    - name: Checkout Build Center controller
      uses: actions/checkout@v6
      with:
        path: .build-center
        persist-credentials: false
    - name: Prepare immutable update candidate
      env:
        CENTER_PLAN: ${{ needs.resolve.outputs.plan }}
      run: python3 "$GITHUB_WORKSPACE/.build-center/build-center/ci/bootstrap.py" builder
    - name: Require the exact ${{ needs.resolve.outputs.code }} source pair
      run: |
        set -euo pipefail
        test '${{ needs.resolve.outputs.pin }}' = ${{ needs.resolve.outputs.pin }}
        test '${{ needs.resolve.outputs.code }}' = ${{ needs.resolve.outputs.code }}
    - uses: actions/checkout@v6
      with:
        repository: SukiSU-Ultra/SukiSU-Ultra
        ref: ${{ needs.resolve.outputs.pin }}
        fetch-depth: 0
        path: sukisu
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: nightly
        targets: aarch64-linux-android
        components: rust-src
    - name: Install Clang and bindgen prerequisites
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-18 libclang-18-dev llvm-18
    - uses: nttld/setup-ndk@v1
      id: ndk
      with:
        ndk-version: r29
    - name: Verify immutable official workspace lock
      run: |
        set -euo pipefail
        mkdir -p userspace-artifacts
        test ! -e sukisu/target
        python3 builder/android14-6.1/build-helpers/sukisu_${{ needs.resolve.outputs.code }}_lock.py sukisu
        python3 builder/android14-6.1/build-helpers/test-sukisu-${{ needs.resolve.outputs.code }}-bindings.py
        python3 builder/android14-6.1/build-helpers/verify-sukisu-${{ needs.resolve.outputs.code }}-userspace.py sukisu --receipt userspace-artifacts/BUILD-IDENTITY.json
    - name: Validate both real Android dependency graphs with --locked
      working-directory: sukisu
      run: |
        set -euo pipefail
        cargo +nightly metadata --locked --format-version 1 --filter-platform aarch64-linux-android --manifest-path userspace/ksuinit/Cargo.toml > ../userspace-artifacts/ksuinit-metadata.json
        cargo +nightly metadata --locked --format-version 1 --filter-platform aarch64-linux-android --manifest-path userspace/ksud/Cargo.toml > ../userspace-artifacts/ksud-metadata.json
    - name: Build native workspace ksuinit for Android ARM64
      working-directory: sukisu
      env:
        ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
      run: |
        set -euo pipefail
        source .github/scripts/setup-rust-build.sh aarch64-linux-android 26
        BUILTINS="$($CLANG_PATH --print-resource-dir)/lib/linux/libclang_rt.builtins-aarch64-android.a"
        test -s "$BUILTINS"
        export RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=$BUILTINS"
        cargo +nightly build --locked --package ksuinit --target aarch64-linux-android --release
    - name: Build native SukiSU ksud and capture its actual OUT_DIR
      working-directory: sukisu
      env:
        ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
      run: |
        set -euo pipefail
        source .github/scripts/setup-rust-build.sh aarch64-linux-android 26
        cp target/aarch64-linux-android/release/ksuinit userspace/ksud/bin/aarch64/
        "$LLVM_BIN/clang" --target=aarch64-linux-android26 -c -nostdlib -o userspace/ksud/.lkm_image_bootstrap.o userspace/ksud/src/lkm_image_bootstrap.S
        cargo +nightly build --locked --package ksud --target aarch64-linux-android --release --message-format=json-render-diagnostics | tee ../userspace-artifacts/ksud-build-messages.jsonl
    - name: Verify immutable locks, real generated UAPI6 and ARM64 binaries
      run: |
        set -euo pipefail
        python3 builder/android14-6.1/build-helpers/verify-sukisu-${{ needs.resolve.outputs.code }}-userspace.py sukisu --receipt userspace-artifacts/BUILD-IDENTITY.json --verify-build --build-messages userspace-artifacts/ksud-build-messages.jsonl
        cp sukisu/target/aarch64-linux-android/release/ksud sukisu/target/aarch64-linux-android/release/ksuinit userspace-artifacts/
        cp sukisu/Cargo.lock userspace-artifacts/Cargo.effective.lock
        git -C sukisu show HEAD:Cargo.lock > userspace-artifacts/Cargo.upstream.lock
        cd userspace-artifacts
        sha256sum ksud ksuinit *.lock *-metadata.json ksud-build-messages.jsonl BUILD-IDENTITY.json > SHA256SUMS
    - uses: actions/upload-artifact@v7
      with:
        name: SukiSU-${{ needs.resolve.outputs.code }}-ARM64-ksud-ksuinit
        path: userspace-artifacts/
        if-no-files-found: error
        retention-days: 30
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    permissions:
      contents: read
  zeromount:
    name: ZeroMount SukiSU / Enhanced SUSFS compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v6
      with:
        path: builder
        repository: kaos2310/Super-Builders
        ref: f269b2d31779901efe920c3c8a3f00838e35e119
        persist-credentials: false
    - name: Checkout Build Center controller
      uses: actions/checkout@v6
      with:
        path: .build-center
        persist-credentials: false
    - name: Prepare immutable update candidate
      env:
        CENTER_PLAN: ${{ needs.resolve.outputs.plan }}
      run: python3 "$GITHUB_WORKSPACE/.build-center/build-center/ci/bootstrap.py" builder
    - name: Test integrated BRENE75 adapter without Android device access
      run: |
        set -euo pipefail
        python3 -B builder/android14-6.1/build-helpers/zeromount-brene75-${{ needs.resolve.outputs.code }}/test.py
        bash -n builder/android14-6.1/build-helpers/zeromount-brene71/zm-brene71
        cp -r builder/android14-6.1/build-helpers/zeromount-brene71 brene71-adapter
    - name: Checkout immutable ZeroMount and Resetprop sources
      uses: actions/checkout@v6
      with:
        repository: Enginex0/zeromount
        ref: c3cb7ffdf749f2441928ec47798615a4c79fab65
        submodules: recursive
        path: zeromount
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android
    - name: Apply bounded SukiSU flag compatibility patch
      run: |
        set -euo pipefail
        mkdir -p module-artifacts
        python3 builder/android14-6.1/build-helpers/zeromount-bakasu/apply.py zeromount \
          --receipt module-artifacts/SOURCE-PATCH.json
        git -C zeromount diff -- module/customize.sh src/detect/susfs.rs \
          > module-artifacts/zeromount-sukisu.patch
    - name: Test both manager flags and kernel-first SUSFS classification
      run: |
        set -euo pipefail
        python3 builder/android14-6.1/build-helpers/zeromount-bakasu/test.py zeromount \
          --work-dir "$RUNNER_TEMP/zeromount-detection"
        cp "$RUNNER_TEMP/zeromount-detection/DETECTION-TESTS.json" module-artifacts/
    - name: Setup upstream Android NDK r27c
      id: ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r27c
    - name: Build patched Android ARM64 binary with locked dependencies
      working-directory: zeromount
      env:
        ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
      run: |
        set -euo pipefail
        NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
        export PATH="$NDK_BIN:$PATH"
        export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android26-clang"
        export CC_aarch64_linux_android="$CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER"
        export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
        test ! -e target
        cargo build --release --locked --target aarch64-linux-android
        test -s target/aarch64-linux-android/release/zeromount
        file target/aarch64-linux-android/release/zeromount
        readelf -h target/aarch64-linux-android/release/zeromount | grep -q AArch64
        git diff --exit-code -- Cargo.toml Cargo.lock
    - name: Package ARM64 module with official WebUI and auxiliary files
      run: |
        set -euo pipefail
        curl --fail --location --retry 3 \
          https://github.com/Enginex0/zeromount/releases/download/v2.0.216-dev/zeromount-v2.0.216-dev.zip \
          --output "$RUNNER_TEMP/zeromount-official.zip"
        python3 builder/android14-6.1/build-helpers/zeromount-bakasu/package-sukisu-${{ needs.resolve.outputs.code }}.py zeromount \
          --bakasu-version ${{ needs.resolve.outputs.code }} --bakasu-commit ${{ needs.resolve.outputs.pin }} \
          --base-zip "$RUNNER_TEMP/zeromount-official.zip" \
          --binary zeromount/target/aarch64-linux-android/release/zeromount \
          --tests module-artifacts/DETECTION-TESTS.json --output-dir module-artifacts
    - uses: actions/upload-artifact@v7
      with:
        name: ZeroMount-SukiSU-${{ needs.resolve.outputs.code }}-compat-ARM64
        path: |
          module-artifacts/
          brene71-adapter/
        if-no-files-found: error
        retention-days: 30
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    permissions:
      contents: read
  resusfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
      with:
        repository: kaos2310/Super-Builders
        ref: f269b2d31779901efe920c3c8a3f00838e35e119
        persist-credentials: false
    - name: Checkout Build Center controller
      uses: actions/checkout@v6
      with:
        path: .build-center
        persist-credentials: false
    - name: Prepare immutable update candidate
      env:
        CENTER_PLAN: ${{ needs.resolve.outputs.plan }}
      run: python3 "$GITHUB_WORKSPACE/.build-center/build-center/ci/bootstrap.py" .
    - name: Download the exact official SuSFS CLI sources
      run: python3 "$GITHUB_WORKSPACE/android14-6.1/build-helpers/_center_runtime.py" update-tool
    - name: Verify retained ReSuSFS behavior and new feature gates
      run: |
        set -euo pipefail
        python3 -B android14-6.1/build-helpers/resusfs-${{ needs.resolve.outputs.code }}-240/test.py
        node android14-6.1/build-helpers/resusfs-${{ needs.resolve.outputs.code }}-240/test.mjs
    - uses: nttld/setup-ndk@v1
      id: ndk
      with:
        ndk-version: r27c
    - name: Build private official SUSFS2.4.0 tool and runtime helper
      env:
        ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
      run: |
        set -euo pipefail
        mkdir -p module-output
        python3 -B android14-6.1/build-helpers/resusfs-${{ needs.resolve.outputs.code }}-240/build_tool.py --ndk "$ANDROID_NDK_ROOT" --output module-output/ksu_susfs
        CLANG="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
        "$CLANG" --target=aarch64-linux-android26 -Os -nostdlib -static -fno-builtin -fno-stack-protector -fno-unwind-tables -fno-asynchronous-unwind-tables -Wl,-e,_start -Wl,--build-id=none -Wl,-z,max-page-size=16384 android14-6.1/build-helpers/susfs-runtime-${{ needs.resolve.outputs.code }}/susfs-runtime.c -o module-output/susfs-runtime
        readelf -h module-output/ksu_susfs | grep -q AArch64
        readelf -h module-output/susfs-runtime | grep -q AArch64
    - name: Package ReSuSFS without replacing global tools or saved configuration
      run: |
        set -euo pipefail
        python3 -B android14-6.1/build-helpers/resusfs-${{ needs.resolve.outputs.code }}-240/package.py --runtime-helper module-output/susfs-runtime --susfs-tool module-output/ksu_susfs --output module-output
        python3 -B android14-6.1/build-helpers/resusfs-${{ needs.resolve.outputs.code }}-240/test_package.py module-output/ReSuSFS-v26.10.23-KAOSLAB-SUSFS2.4.0-Runtime1-r2-SukiSU${{ needs.resolve.outputs.code }}-arm64.zip
    - uses: actions/upload-artifact@v7
      with:
        name: ReSuSFS-SUSFS2.4.0-Runtime1-r2-SukiSU${{ needs.resolve.outputs.code }}-ARM64
        path: module-output/
        if-no-files-found: error
        retention-days: 30
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    permissions:
      contents: read
  strict:
    name: SukiSU ${{ '6.1' }}.${{ '162' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      KSU_VARIANT: SukiSU
      KSU_DIR: KernelSU
      RESUKISU_VERSION_CODE: ${{ needs.resolve.outputs.code }}
      RESUKISU_VERSION_LABEL: ${{ needs.resolve.outputs.code }}
      RESUKISU_VERSION_FULL: SukiSU-${{ needs.resolve.outputs.code }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        repository: kaos2310/Super-Builders
        ref: f269b2d31779901efe920c3c8a3f00838e35e119
        persist-credentials: false
    - name: Checkout Build Center controller
      uses: actions/checkout@v6
      with:
        path: .build-center
        persist-credentials: false
    - name: Prepare immutable update candidate
      env:
        CENTER_PLAN: ${{ needs.resolve.outputs.plan }}
      run: python3 "$GITHUB_WORKSPACE/.build-center/build-center/ci/bootstrap.py" .
    - name: Validate UID-gated hiding target
      if: 'true'
      env:
        ANDROID: ${{ 'android14' }}
        KERNEL: ${{ '6.1' }}
        KSU_PIN: ${{ needs.resolve.outputs.pin }}
        ADD_SUSFS: ${{ true }}
        MINIMAL: ${{ false }}
      run: |
        set -euo pipefail
        [[ "$ANDROID" == android14 && "$KERNEL" == 6.1 && "$ADD_SUSFS" == true && "$MINIMAL" == false ]]
        [[ "$KSU_PIN" == ${{ needs.resolve.outputs.pin }} ]]
    - name: Validate experimental DroidSpaces resource-limit request
      if: 'false'
      env:
        ADD_DROIDSPACES: ${{ true }}
        KMI_MODE: ${{ 'strict' }}
        KMI_PROFILE: ${{ 'full-strict' }}
        PACKAGE: ${{ true }}
        DEVICE: ${{ 'e3q' }}
        KERNEL: ${{ '6.1' }}
        MINIMAL: ${{ false }}
      run: |
        set -euo pipefail
        [[ "$ADD_DROIDSPACES" == true && "$DEVICE" == e3q && "$KERNEL" == 6.1 && "$MINIMAL" == false ]]
        [[ "$KMI_MODE" == strict && "$KMI_PROFILE" == resource-limits-strict && "$PACKAGE" == false ]]
        echo "::notice::CPU/PID experiment requested; stock ABI checks remain enforced. Full Samsung module/partition rebuild is unavailable in this source tree."
    - name: Validate KMI build mode
      env:
        KMI_MODE: ${{ 'strict' }}
        KMI_PROFILE: ${{ 'full-strict' }}
        KMI_MINIMAL_CONFIG: ${{ false }}
        PACKAGE_STRICT_ANYKERNEL: ${{ true }}
        DEVICE_CODENAME: ${{ 'e3q' }}
      run: |
        set -euo pipefail
        case "$KMI_MODE" in
          runtime-compat|symtypes|strict) ;;
          *) echo "::error::Unsupported KMI mode: $KMI_MODE"; exit 1 ;;
        esac
        [[ "$KMI_PROFILE" =~ ^[a-z0-9][a-z0-9-]*$ ]] || {
          echo "::error::Invalid KMI profile label: $KMI_PROFILE"
          exit 1
        }
        if [[ "$KMI_MODE" == "runtime-compat" && "$KMI_MINIMAL_CONFIG" == "true" ]]; then
          echo "::error::Minimal config is diagnostic-only"
          exit 1
        fi
        if [[ "$PACKAGE_STRICT_ANYKERNEL" == "true" ]]; then
          [[ "$KMI_MODE" == "strict" ]] || {
            echo "::error::Strict AnyKernel packaging requires kmi_mode=strict"
            exit 1
          }
          [[ "$KMI_PROFILE" == "full-strict" ]] || {
            echo "::error::Strict AnyKernel packaging is restricted to kmi_profile=full-strict"
            exit 1
          }
          [[ "$KMI_MINIMAL_CONFIG" == "false" ]] || {
            echo "::error::Strict AnyKernel packaging cannot use the diagnostic minimal config"
            exit 1
          }
          [[ "$DEVICE_CODENAME" == "e3q" ]] || {
            echo "::error::Strict AnyKernel packaging is restricted to device_codename=e3q"
            exit 1
          }
        fi
    - name: Free Disk Space
      uses: endersonmenezes/free-disk-space@v3
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: true
        remove_packages: azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*
        remove_packages_one_command: true
        remove_folders: /usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell
          /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle
        rm_cmd: rmz
        rmz_version: 3.1.1
        testing: false
    - name: Install LLD
      run: sudo apt-get install -y -qq lld binutils
    - name: Download AnyKernel3 Artifact
      uses: actions/download-artifact@v8
      with:
        name: anykernel3
        path: AnyKernel3
    - name: Download Git Repo Tool Artifact
      uses: actions/download-artifact@v8
      with:
        name: git-repo-tool
        path: git-repo
    - name: Download Kernel Patches Artifact
      uses: actions/download-artifact@v8
      with:
        name: kernel-patches
        path: kernel_patches
    - name: Download SukiSU Patch
