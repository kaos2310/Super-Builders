            __tracepoint_android_rvh_nf_conn_alloc \
            __tracepoint_android_rvh_nf_conn_free \
            __tracepoint_android_vh_xhci_suspend \
            __tracepoint_android_vh_xhci_resume; do
            grep -qF "$SYMBOL" "$IMAGE_STRINGS" || {
              echo "::error::Packaged strict Image lacks required Samsung KMI symbol: $SYMBOL"
              exit 1
            }
          done
        fi
        if grep -qF 'Thu Jan  1 00:00:00 UTC 1970' "$IMAGE_STRINGS"; then
          echo "::error::Kernel image still contains the zero-epoch UTS timestamp"
          exit 1
        fi

        python3 -B "$GITHUB_WORKSPACE/android14-6.1/build-helpers/sukisu-kpm-${{ needs.resolve.outputs.code }}/verify_image.py" \
          --image "$ANYKERNEL3/Image" --receipt "$ANYKERNEL3/SUKISU-KPM-IMAGE.json" \
          --abi "$ANYKERNEL3/SUKISU-KPM-ABI.json" --config "$IKCONFIG"

        ANYKERNEL_ZIP="$RUNNER_TEMP/${FILE_NAME}-AnyKernel3.zip"
        (cd "$ANYKERNEL3" && zip -X -qr "$ANYKERNEL_ZIP" .)
        unzip -l "$ANYKERNEL_ZIP"
        unzip -p "$ANYKERNEL_ZIP" anykernel.sh | grep -F 'susfs_log=0'
        unzip -p "$ANYKERNEL_ZIP" anykernel.sh | grep -F 'patch_cmdline "kpti=" ""'
        unzip -p "$ANYKERNEL_ZIP" anykernel.sh | grep -F 'patch_cmdline "kasan=" "kasan=off"'
        unzip -p "$ANYKERNEL_ZIP" anykernel.sh | grep -F 'avc_log_spoofing 1'
        unzip -p "$ANYKERNEL_ZIP" anykernel.sh | grep -F 'hide_sus_mnts_for_all_or_non_su_procs 0'
        if unzip -p "$ANYKERNEL_ZIP" anykernel.sh | grep -F 'performance'; then
          echo "::error::Audited AnyKernel ZIP still contains a forced performance policy"
          exit 1
        fi
        if [[ "$PACKAGE_STRICT_ANYKERNEL" == "true" ]]; then
          unzip -p "$ANYKERNEL_ZIP" anykernel.sh | grep -F 'patch_cmdline "log_buf_len=" "log_buf_len=4M"'
          unzip -p "$ANYKERNEL_ZIP" STRICT-KMI.txt | grep -F 'Target firmware: S928BXXS6EZJ1 (EUX)'
          unzip -p "$ANYKERNEL_ZIP" STRICT-KMI.txt | grep -F 'Target package: AP_S928BXXS6EZJ1_S928BXXS6EZJ1_MQB116000712_REV00_user_low_ship_MULTI_CERT_meta_OS17.tar.md5'
          unzip -p "$ANYKERNEL_ZIP" STRICT-KMI.txt | grep -F 'Full Odin AP tar MD5: 25d02d0e6350c19a81d9c42a83d244db'
          unzip -p "$ANYKERNEL_ZIP" STRICT-KMI.txt | grep -F 'Full Odin AP SHA-256: 3f0460c144bd5a9b426efd067a7960a1e9a56056d75cddc594a90b22fd388ce6'
          unzip -p "$ANYKERNEL_ZIP" STRICT-KMI.txt | grep -F 'Full Odin CP package: CP_S928BXXS6EZJ1_CP36865534_MQB116000712_REV00_user_low_ship_MULTI_CERT.tar.md5'
          unzip -p "$ANYKERNEL_ZIP" STRICT-KMI.txt | grep -F 'Full Odin CP tar MD5: fe650ac1457a82b1c930e16e595cfcbf'
          unzip -p "$ANYKERNEL_ZIP" STRICT-KMI.txt | grep -F 'Full Odin CP SHA-256: 366ce8d60e732bbb63f1d3c7df623942232a32cdbddc4a7105dd9fa9a7c25a83'
          unzip -p "$ANYKERNEL_ZIP" STRICT-KMI.txt | grep -F 'Full Odin CSC package: CSC_OXM_S928BOXM6EZJ1_MQB116000712_REV00_user_low_ship_MULTI_CERT.tar.md5'
          unzip -p "$ANYKERNEL_ZIP" STRICT-KMI.txt | grep -F 'Full Odin CSC tar MD5: 691fae5268fd208b52f76812f0aabb6c'
          unzip -p "$ANYKERNEL_ZIP" STRICT-KMI.txt | grep -F 'Full Odin CSC SHA-256: 222dbbef5792dbf90b822716174f4865769eadf85b2ead270e52a46c38c0693d'
          unzip -p "$ANYKERNEL_ZIP" STRICT-KMI.txt | grep -F 'Full Odin HOME_CSC package: HOME_CSC_OXM_S928BOXM6EZJ1_MQB116000712_REV00_user_low_ship_MULTI_CERT.tar.md5'
          unzip -p "$ANYKERNEL_ZIP" STRICT-KMI.txt | grep -F 'Full Odin HOME_CSC tar MD5: ecc3430d9501f7a0540bd3f459e1d7af'
          unzip -p "$ANYKERNEL_ZIP" STRICT-KMI.txt | grep -F 'Full Odin HOME_CSC SHA-256: f86eeea657eec9b2841df56acc30021e898d93cba8203c07baf5f3530635bba3'
          unzip -p "$ANYKERNEL_ZIP" STRICT-KMI.txt | grep -F 'Source OTA SHA-256: not-applicable-full-odin-archives'
          unzip -p "$ANYKERNEL_ZIP" STRICT-KMI.txt | grep -F 'Stock init_boot.img SHA-256: ef1c6c13fad89b25730b8cfcbab5ad319c53287b6484e8d0dbbec3829f06f0e9'
          unzip -p "$ANYKERNEL_ZIP" STRICT-KMI.txt | grep -F 'Stock vendor_dlkm.img SHA-256: 603cead6f3adf4b9297f602a876d21794f7070808f531031d38dea2213ccf972'
          unzip -p "$ANYKERNEL_ZIP" STRICT-KMI.txt | grep -F 'Stock system_dlkm.img SHA-256: ebd79447ddb34cc304a362bf4e4e79df83ceaf90c3e2078e6ca36dbbf50ba184'
          unzip -p "$ANYKERNEL_ZIP" STRICT-KMI.txt | grep -F 'Stock dtbo.img SHA-256: effeaa7012ee911ab515d2d6f96a301e91a86c9db7570fc175f8170000d90965'
          unzip -p "$ANYKERNEL_ZIP" STRICT-KMI.txt | grep -F 'Stock vbmeta.img SHA-256: a99e64491ade630ee7d013a6fdedf3f41a1fb143d3954b39aace9d6f670e50b6'
          unzip -p "$ANYKERNEL_ZIP" STRICT-KMI.txt | grep -F 'Stock NON-HLOS.bin SHA-256: 6014d995c168a9b8c5191261610226f0a2e0e089823ebc61ae68ad72ab213c5f'
          unzip -p "$ANYKERNEL_ZIP" STRICT-KMI.txt | grep -F 'Stock modem.bin SHA-256: 20973d50b214a505a7c1ec365854bf4a59cdd265ca611a11d1ec084870d63b1e'
          unzip -p "$ANYKERNEL_ZIP" STRICT-KMI.txt | grep -F 'KEEP_OEM_UNLOCK BL package: BL_S928BXXS6EZJ1_KEEP_OEM_UNLOCK.tar.md5'
          unzip -p "$ANYKERNEL_ZIP" STRICT-KMI.txt | grep -F 'KEEP_OEM_UNLOCK vbmeta flags: 3'
          unzip -p "$ANYKERNEL_ZIP" STRICT-KMI.txt | grep -F 'KEEP_OEM_UNLOCK policy: avb-flags-3-intentional-keep-oem-unlock'
          unzip -p "$ANYKERNEL_ZIP" STRICT-KMI.txt | grep -F 'Samsung source baseline: S928BXXS6DZG1 / SM-S928B_16_Opensource.zip (512c0a0b74646ddbb64ac8adea7c396c90458c2c12cf7f437e9d20282a33fa3c)'
          unzip -p "$ANYKERNEL_ZIP" STRICT-KMI.txt | grep -F 'Exact EZJ1 Samsung OSS source: not independently verified; audited source port retained.'
          unzip -p "$ANYKERNEL_ZIP" STRICT-KMI.txt | grep -F 'Source method: audited DZG1 Samsung delta ported onto AOSP common 4bd1b41bff8bb87bed8c3621fa2bb5b2e96f5d8c.'
          unzip -p "$ANYKERNEL_ZIP" STRICT-KMI.txt | grep -F 'All 2485 target Samsung DLKM symbols must match exactly.'
          unzip -p "$ANYKERNEL_ZIP" STRICT-KMI.txt | grep -F 'EZJ1 vendor_dlkm validation covered all 351'
          mkdir -p "$GITHUB_WORKSPACE/strict-flash"
          cp "$ANYKERNEL_ZIP" "$GITHUB_WORKSPACE/strict-flash/"
          sha256sum "$GITHUB_WORKSPACE/strict-flash/$(basename "$ANYKERNEL_ZIP")" \
            > "$GITHUB_WORKSPACE/strict-flash/$(basename "$ANYKERNEL_ZIP").sha256"
        fi
        sha256sum "$ANYKERNEL_ZIP" "$ANYKERNEL3/Image"
    - name: Scan Patch Rejects
      if: always()
      run: |
        REJECTS_DIR="$GITHUB_WORKSPACE/patch-rejects"
        mkdir -p "$REJECTS_DIR"
        mapfile -t REJS < <(find "$KERNEL_ROOT" -type f -name '*.rej')
        REJ_COUNT=${#REJS[@]}
        echo "REJ_COUNT=$REJ_COUNT" >> "$GITHUB_ENV"
        if [ "$REJ_COUNT" -gt 0 ]; then
          for REJ in "${REJS[@]}"; do
            REL="${REJ#"$KERNEL_ROOT"/}"
            DEST="$REJECTS_DIR/$REL"
            mkdir -p "$(dirname "$DEST")"
            cp "$REJ" "$DEST"
            ORIG="${REJ%.rej}"
            [ -f "$ORIG" ] && cp "$ORIG" "$REJECTS_DIR/${REL%.rej}"
          done
        fi
    - name: Upload SuSFS runtime evidence
      if: always() && true
      uses: actions/upload-artifact@v7
      with:
        name: SukiSU-${{ needs.resolve.outputs.code }}-Runtime-v1-${{ github.run_id }}
        path: susfs-runtime-audit/
        if-no-files-found: warn
        retention-days: 30
    - name: Upload Artifact
      if: '''strict'' == ''runtime-compat'' || true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.FILE_NAME }}-AnyKernel3
        path: ./AnyKernel3/**
        if-no-files-found: error
        compression-level: 9
    - name: Upload exact flashable Strict KMI ZIP
      if: 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.FILE_NAME }}-Strict-AnyKernel3-Flash
        path: strict-flash/
        if-no-files-found: error
        compression-level: 0
        retention-days: 7
    - name: Upload KPM source build and exact original Image evidence
      if: always() && true
      uses: actions/upload-artifact@v7
      with:
        name: SukiSU-${{ needs.resolve.outputs.code }}-KPM-engine-audit-${{ github.run_id }}
        path: kpm-engine-audit/
        if-no-files-found: ignore
        retention-days: 30
    - name: Upload Rejects
      if: always() && env.REJ_COUNT > 0
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.FILE_NAME }}-Rejects
        path: patch-rejects/
        if-no-files-found: ignore
        compression-level: 9
    - name: Job Summary
      if: always()
      env:
        ADD_SUSFS: ${{ true }}
        ADD_ZEROMOUNT: ${{ true }}
        ADD_DROIDSPACES: ${{ true }}
        ADD_ZRAM: ${{ true }}
        ADD_BBG: ${{ true }}
        ADD_OVERLAYFS: ${{ true }}
        ADD_KPM: ${{ true }}
        SUSFS_OPEN_REDIRECT_TEST: ${{ true }}
        KMI_MODE: ${{ 'strict' }}
        KMI_PROFILE: ${{ 'full-strict' }}
      run: |
        S() { [[ "$1" == "true" ]] && echo "Enabled" || echo "Disabled"; }
        {
          echo "## SukiSU | ${KERNEL_VER}.${SUBLEVEL}"
          echo ""
          echo "| Feature | Status |"
          echo "|---------|--------|"
          echo "| **Kernel** | ${KERNEL_VER}.${SUBLEVEL} |"
          echo "| **Android** | ${ANDROID_VER} |"
          echo "| **OS Patch Level** | ${OS_PATCH} |"
          if [[ "$ADD_SUSFS" == "true" ]]; then
            echo "| **SUSFS source** | ${SUSFS_EXPECTED_VERSION:-not-recorded} @ ${SUSFS_PINNED_COMMIT:-not-recorded} |"
          fi
          echo "| **Native SUSFS port** | ${RESUKISU_SU_SESSION_PORT:-disabled} |"
          echo "| **UIDGate-v1 requested** | ${{ true }} |"
          echo "| **UIDGate-v1 packaged Image proof** | ${SUSFS_UID_GATE_ATTESTED:-not-attested} |"
          echo "| **Enhanced SUSFS** | $(S "$ADD_SUSFS") |"
          echo "| **SUSFS Open Redirect (Test)** | $(S "$SUSFS_OPEN_REDIRECT_TEST") |"
          echo "| **ZeroMount** | $(S "$ADD_ZEROMOUNT") |"
          echo "| **Droidspaces 6_7_8** | $(S "$ADD_DROIDSPACES") |"
          echo "| **CPU bandwidth limits requested** | ${{ false }} |"
          echo "| **Full Samsung module/partition rebuild** | Not available in this tree; no rebuilt vendor partitions |"
          echo "| **ZRAM (LZ4K/LZ4KD)** | $(S "$ADD_ZRAM") |"
          echo "| **LZ4 v1.10.0** | $(S "$ADD_ZRAM") |"
          echo "| **Overlayfs Support** | $(S "$ADD_OVERLAYFS") |"
          echo "| **Unicode Filter** | Enabled |"
          echo "| **Baseband Guard** | $(S "$ADD_BBG") |"
          echo "| **KPM** | $(S "$ADD_KPM") |"
          echo "| **KASAN** | Disabled; inactive KMI static-key stub retained |"
          echo "| **KMI mode** | ${KMI_MODE} (${KMI_PROFILE}) |"
          echo "| **Gunyah adaptive backing** | ${GUNYAH_ADAPTIVE_BACKING:-0} (device startup unverified) |"
          echo "| **Samsung DLKM CRCs** | ${SAMSUNG_DLKM_EXACT_COUNT:-not-recorded} exact, ${SAMSUNG_DLKM_COMPATIBLE_COUNT:-not-recorded} known differences, ${SAMSUNG_DLKM_UNEXPECTED_COUNT:-not-recorded} unexpected |"
          echo "| **Kernel build exit** | ${KERNEL_BUILD_EXIT_CODE:-not-recorded} |"
          echo "| **Device Profile** | ${IDENTITY_STATUS:-Generic} |"
          echo "| **Rejects** | ${REJ_COUNT:-0} |"
          if [[ "$KMI_MODE" == "runtime-compat" || "${{ true }}" == "true" ]]; then
            echo "| **Artifact** | ${FILE_NAME} |"
          else
            echo "| **Artifact** | Non-flashable KMI diagnostics only |"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
        REPORT="$GITHUB_WORKSPACE/$VERSION_DIR/build-helpers/report-config.sh"
        [ -f "$REPORT" ] && bash "$REPORT" "$KERNEL_ROOT" "$ANDROID_VER" "$KERNEL_VER" || true
    - name: Upload immutable plan and source manifests
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: Build-Center-Source-Evidence-${{ github.run_id }}
        path: |-
          .build-center-plan.json
          **/.build-center-source-manifest.json
          **/.build-center-susfs-update.json
          .build-center-susfs/upstream-changes.json
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 30
    needs:
    - resolve
    - dependencies
    - userspace
    - zeromount
    if: needs.resolve.outputs.build == 'true'
    permissions:
      contents: write
      actions: write
  publish:
    name: Geprüfte Kernel-ZIP und SuSFS zum Download bereitstellen
    needs:
    - resolve
    - strict
    - userspace
    - zeromount
    - resusfs
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v8
      with:
        pattern: '*-Strict-AnyKernel3-Flash'
        path: release-files
        merge-multiple: true
    - uses: actions/download-artifact@v8
      with:
        pattern: ReSuSFS-*
        path: resusfs-files
        merge-multiple: true
    - name: ZIP-Inhalt prüfen und Release mit SHA-256 veröffentlichen
      env:
        GH_TOKEN: ${{ github.token }}
        CENTER_PLAN: ${{ needs.resolve.outputs.plan }}
      run: python3 build-center/ci/publish.py release-files
