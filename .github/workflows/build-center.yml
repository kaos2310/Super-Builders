    - name: Attest compiled SuSFS runtime controls
      if: true && ('strict' == 'runtime-compat' || true)
      run: |
        set -euo pipefail
        PORT="$GITHUB_WORKSPACE/android14-6.1/build-helpers/susfs-runtime-${{ needs.resolve.outputs.code }}"
        VMLINUX="$KERNEL_ROOT/bazel-bin/common/kernel_aarch64/vmlinux"
        [[ -s "$VMLINUX" ]] || VMLINUX="$KERNEL_ROOT/out/${ANDROID_VER}-${KERNEL_VER}/dist/vmlinux"
        python3 "$PORT/apply.py" --common "$KERNEL_ROOT/common" --ksu "$KERNEL_ROOT/$KSU_DIR" --verify-only --config "$FINAL_CONFIG_FILE" --image "$ANYKERNEL3/Image" --vmlinux "$VMLINUX" --receipt "$ANYKERNEL3/SUSFS-RUNTIME.json"
        cp "$ANYKERNEL3/SUSFS-RUNTIME.json" "$GITHUB_WORKSPACE/susfs-runtime-audit/IMAGE.json"
        cp "$KERNEL_ROOT/common/.susfs-release240.json" "$ANYKERNEL3/SUSFS-RELEASE240.json"
        cp "$FINAL_CONFIG_FILE" "$GITHUB_WORKSPACE/susfs-runtime-audit/BUILD-CONFIG.txt"
        python3 "$GITHUB_WORKSPACE/android14-6.1/build-helpers/susfs-hidden-name-readdir/apply.py" \
          --common "$KERNEL_ROOT/common" --verify-only --image "$ANYKERNEL3/Image" --vmlinux "$VMLINUX" \
          --receipt "$ANYKERNEL3/SUSFS-HIDDEN-NAME-READDIR.json"
        cp "$GITHUB_WORKSPACE/susfs-runtime-audit/hidden-name-host/TESTS.json" "$ANYKERNEL3/SUSFS-HIDDEN-NAME-TESTS.json"
        python3 "$GITHUB_WORKSPACE/.build-center/build-center/ci/firmware_profile.py" \
          --root "$GITHUB_WORKSPACE" --image "$ANYKERNEL3/Image" --receipt "$ANYKERNEL3/FIRMWARE-TARGET.json"
        CLANG=$(find "$KERNEL_ROOT/prebuilts/clang/host/linux-x86" -path '*/bin/clang' | head -1)
        test -x "$CLANG"
        "$CLANG" --target=aarch64-linux-android26 -Os -nostdlib -static -fno-builtin -fno-stack-protector -fno-unwind-tables -fno-asynchronous-unwind-tables -Wl,-e,_start -Wl,--build-id=none -Wl,-z,max-page-size=16384 "$PORT/susfs-runtime.c" -o "$GITHUB_WORKSPACE/susfs-runtime-audit/susfs-runtime-arm64"
        sha256sum "$GITHUB_WORKSPACE/susfs-runtime-audit/susfs-runtime-arm64" > "$GITHUB_WORKSPACE/susfs-runtime-audit/SHA256SUMS.txt"
    - name: Audit S928B daily AnyKernel3
      if: '''e3q'' == ''e3q'' && (''strict'' == ''runtime-compat'' || true)'
      env:
        ADD_KPM: ${{ true }}
        REQUIRE_CUSTOM_MANAGER: ${{ '' != '' }}
        EXPECTED_MANAGER_HASH: ${{ '' }}
        KMI_MODE: ${{ 'strict' }}
        PACKAGE_STRICT_ANYKERNEL: ${{ true }}
      run: |
        set -euo pipefail
        test -f "$ANYKERNEL3/Image"

        IMAGE_COUNT=$(find "$ANYKERNEL3" -maxdepth 1 -type f \
          \( -name Image -o -name Image.gz -o -name Image.lz4 \) | wc -l)
        test "$IMAGE_COUNT" -eq 1 || {
          echo "::error::AnyKernel3 must contain exactly one kernel image"
          exit 1
        }

        if grep -R -n -I --exclude='Image*' 'performance' "$ANYKERNEL3"; then
          echo "::error::AnyKernel3 text files still contain a forced performance policy"
          exit 1
        fi
        if grep -aF 'cpufreq.default_governor=performance' "$ANYKERNEL3/Image"; then
          echo "::error::Kernel image still contains the forbidden CPUFreq assignment"
          exit 1
        fi
        if grep -qF 'patch_cmdline "kpti=" "kpti=0"' "$ANYKERNEL3/anykernel.sh"; then
          echo "::error::AnyKernel3 still forces kpti=0"
          exit 1
        fi
        grep -qF 'patch_cmdline "cpufreq.default_governor=" ""' "$ANYKERNEL3/anykernel.sh"
        grep -qF 'patch_cmdline "kpti=" ""' "$ANYKERNEL3/anykernel.sh"
        grep -qF 'patch_cmdline "kasan=" "kasan=off"' "$ANYKERNEL3/anykernel.sh"
        CMDLINE_AUDIT="$GITHUB_WORKSPACE/$VERSION_DIR/build-helpers/audit-s928b-anykernel-cmdline.py"
        CMDLINE_AUDIT_ARGS=()
        if [[ "$PACKAGE_STRICT_ANYKERNEL" == "true" ]]; then
          CMDLINE_AUDIT_ARGS+=(--require-log-buf)
        fi
        python3 "$CMDLINE_AUDIT" "$ANYKERNEL3" "${CMDLINE_AUDIT_ARGS[@]}"
        grep -qF 'susfs_log=0' "$ANYKERNEL3/anykernel.sh"
        grep -qF 'set_shell_value "$SUSFS_CFG" avc_log_spoofing 1' "$ANYKERNEL3/anykernel.sh"
        grep -qF 'set_shell_value "$SUSFS_CFG" hide_sus_mnts_for_all_or_non_su_procs 0' "$ANYKERNEL3/anykernel.sh"
        grep -qF 'set_json_bool "$NATIVE_SUSFS_JSON" enabled false' "$ANYKERNEL3/anykernel.sh"
        grep -qF 'set_toml_bool "$ZEROMOUNT_CFG" hide_sus_mounts false' "$ANYKERNEL3/anykernel.sh"
        grep -aqF 'kasan_flag_enabled' "$ANYKERNEL3/Image" || {
          echo "::error::Kernel image is missing the GKI-required kasan_flag_enabled export"
          exit 1
        }

        IKCONFIG="$RUNNER_TEMP/s928b-final-ikconfig"
        "$KERNEL_ROOT/common/scripts/extract-ikconfig" "$ANYKERNEL3/Image" > "$IKCONFIG"
        test -s "$IKCONFIG"
        DAILY_AUDIT="$GITHUB_WORKSPACE/$VERSION_DIR/build-helpers/audit-s928b-sukisu-${{ needs.resolve.outputs.code }}-config.sh"
        chmod +x "$DAILY_AUDIT"
        "$DAILY_AUDIT" "$IKCONFIG" "$ADD_KPM" "$REQUIRE_CUSTOM_MANAGER" "$KMI_MODE" "${{ false }}"
        grep -qx 'CONFIG_IP6_NF_NAT=y' "$IKCONFIG" || {
          echo "::error::Embedded IKCONFIG must retain actual IPv6 NAT support"
          exit 1
        }
        if [[ "${{ true }}" == true ]]; then
          python3 "$GITHUB_WORKSPACE/android14-6.1/build-helpers/droidspaces-gki/configure.py" verify \
            --config "$IKCONFIG" --receipt "$ANYKERNEL3/DROIDSPACES-CONFIG.json"
        fi
        grep -aF 'tcp_bbr3' "$ANYKERNEL3/Image" >/dev/null || {
          echo "::error::BBRv3 code is missing from the kernel image"
          exit 1
        }
        grep -aF '/dev/ntsync' "$ANYKERNEL3/Image" >/dev/null || {
          echo "::error::NTSYNC code is missing from the kernel image"
          exit 1
        }
        if [[ "$REQUIRE_CUSTOM_MANAGER" == "true" ]]; then
          grep -aF "$EXPECTED_MANAGER_HASH" "$ANYKERNEL3/Image" >/dev/null || {
            echo "::error::Paired manager certificate hash is missing from the kernel image"
            exit 1
          }
        fi
        grep -aF '947ae944f3de4ed4c21a7e4f7953ecf351bfa2b36239da37a34111ad29993eef' "$ANYKERNEL3/Image" >/dev/null || {
          echo "::error::Official SukiSU manager certificate hash is missing from the kernel image"
          exit 1
        }

        if [[ "$PACKAGE_STRICT_ANYKERNEL" == "true" ]]; then
          test "$SAMSUNG_SOURCE_BASE_APPLIED" = "true"
          test "$SAMSUNG_COMMON_CHANGED_COUNT" = "402"
          test "$SAMSUNG_COMMON_ADDED_COUNT" = "421"
          test "$SAMSUNG_COMMON_DELETED_COUNT" = "308"
          test "$SAMSUNG_DLKM_BASELINE_COUNT" = "2485"
          test "$SAMSUNG_DLKM_EXACT_COUNT" = "2485"
          test "$SAMSUNG_DLKM_COMPATIBLE_COUNT" = "0"
          test "$SAMSUNG_DLKM_UNEXPECTED_COUNT" = "0"
          test "$SAMSUNG_DLKM_MISSING_COUNT" = "0"
          test "$SAMSUNG_DLKM_RUNTIME_FALLBACK" = "strict-rejection"
          grep -qx '# CONFIG_CGROUP_PIDS is not set' "$IKCONFIG"
          grep -qx '# CONFIG_LRU_GEN_STATS is not set' "$IKCONFIG"
          grep -qx 'CONFIG_LRU_GEN=y' "$IKCONFIG"
          grep -qx 'CONFIG_EROFS_FS_ZIP_LZMA=y' "$IKCONFIG"
          grep -qx 'CONFIG_XZ_DEC_MICROLZMA=y' "$IKCONFIG"
          test "$STOCK_FIRMWARE_EXPECTED" = "S928BXXS6EZJ1"
          test "$STOCK_CSC_EXPECTED" = "EUX"
          grep -qF 'patch_cmdline "log_buf_len=" "log_buf_len=4M"' "$ANYKERNEL3/anykernel.sh"
          grep -qF 'Target firmware: S928BXXS6EZJ1 (EUX)' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'Target package: AP_S928BXXS6EZJ1_S928BXXS6EZJ1_MQB116000712_REV00_user_low_ship_MULTI_CERT_meta_OS17.tar.md5' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'Full Odin AP tar MD5: 25d02d0e6350c19a81d9c42a83d244db' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'Full Odin AP SHA-256: 3f0460c144bd5a9b426efd067a7960a1e9a56056d75cddc594a90b22fd388ce6' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'Full Odin CP package: CP_S928BXXS6EZJ1_CP36865534_MQB116000712_REV00_user_low_ship_MULTI_CERT.tar.md5' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'Full Odin CP tar MD5: fe650ac1457a82b1c930e16e595cfcbf' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'Full Odin CP SHA-256: 366ce8d60e732bbb63f1d3c7df623942232a32cdbddc4a7105dd9fa9a7c25a83' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'Full Odin CSC package: CSC_OXM_S928BOXM6EZJ1_MQB116000712_REV00_user_low_ship_MULTI_CERT.tar.md5' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'Full Odin CSC tar MD5: 691fae5268fd208b52f76812f0aabb6c' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'Full Odin CSC SHA-256: 222dbbef5792dbf90b822716174f4865769eadf85b2ead270e52a46c38c0693d' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'Full Odin HOME_CSC package: HOME_CSC_OXM_S928BOXM6EZJ1_MQB116000712_REV00_user_low_ship_MULTI_CERT.tar.md5' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'Full Odin HOME_CSC tar MD5: ecc3430d9501f7a0540bd3f459e1d7af' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'Full Odin HOME_CSC SHA-256: f86eeea657eec9b2841df56acc30021e898d93cba8203c07baf5f3530635bba3' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'Source OTA SHA-256: not-applicable-full-odin-archives' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'Stock init_boot.img SHA-256: ef1c6c13fad89b25730b8cfcbab5ad319c53287b6484e8d0dbbec3829f06f0e9' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'Stock vendor_dlkm.img SHA-256: 603cead6f3adf4b9297f602a876d21794f7070808f531031d38dea2213ccf972' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'Stock system_dlkm.img SHA-256: ebd79447ddb34cc304a362bf4e4e79df83ceaf90c3e2078e6ca36dbbf50ba184' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'Stock dtbo.img SHA-256: effeaa7012ee911ab515d2d6f96a301e91a86c9db7570fc175f8170000d90965' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'Stock vbmeta.img SHA-256: a99e64491ade630ee7d013a6fdedf3f41a1fb143d3954b39aace9d6f670e50b6' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'Stock NON-HLOS.bin SHA-256: 6014d995c168a9b8c5191261610226f0a2e0e089823ebc61ae68ad72ab213c5f' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'Stock modem.bin SHA-256: 20973d50b214a505a7c1ec365854bf4a59cdd265ca611a11d1ec084870d63b1e' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'KEEP_OEM_UNLOCK BL package: BL_S928BXXS6EZJ1_KEEP_OEM_UNLOCK.tar.md5' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'KEEP_OEM_UNLOCK BL tar MD5: 26568a450f97914b000269e05e360ee1' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'KEEP_OEM_UNLOCK BL SHA-256: b23c582b2488d4ff334e613e1347ad4568711d5c705d3d7bba734fb2a7e598c7' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'KEEP_OEM_UNLOCK vbmeta.img SHA-256: 67b8d114c5c1af81c473fb649f5b47cca340a5744baed548db9660e5907a4535' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'KEEP_OEM_UNLOCK vbmeta flags: 3' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'KEEP_OEM_UNLOCK policy: avb-flags-3-intentional-keep-oem-unlock' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'Samsung source baseline: S928BXXS6DZG1 / SM-S928B_16_Opensource.zip (512c0a0b74646ddbb64ac8adea7c396c90458c2c12cf7f437e9d20282a33fa3c)' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'Exact EZJ1 Samsung OSS source: not independently verified; audited source port retained.' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'Source method: audited DZG1 Samsung delta ported onto AOSP common 4bd1b41bff8bb87bed8c3621fa2bb5b2e96f5d8c.' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'Source port archive SHA-256: a9538364b3539754fcc4be676a02fff81694af61504a0afdcc0212a803042346' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'Samsung common delta: 402 changed,' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF '421 added, 308 removed.' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'All 2485 target Samsung DLKM symbols must match exactly.' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'Samsung XHCI and nf_conn alloc/free hooks are declared, exported, KMI-retained,' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'CRC mismatches are rejected by the module loader.' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'symbols with 0 CRC changes.' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'EZJ1 vendor_dlkm validation covered all 351' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF 'modules and all 2485 strict baseline' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF '762 modules and' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF '4900 imports with' "$ANYKERNEL3/STRICT-KMI.txt"
          grep -qF '0 CRC conflicts.' "$ANYKERNEL3/STRICT-KMI.txt"
        fi

        IMAGE_STRINGS="$RUNNER_TEMP/s928b-image-strings"
        strings "$ANYKERNEL3/Image" > "$IMAGE_STRINGS"
        if [[ "${GUNYAH_ADAPTIVE_BACKING:-0}" == "1" ]]; then
          grep -qF 'allocated adaptive bounded backing' "$IMAGE_STRINGS" || {
            echo '::error::Packaged Image lacks the adaptive Gunyah allocator marker'
            exit 1
          }
          printf '%s\n' \
            'Gunyah adaptive backing V1: original request-size ABI retained.' \
            'At most 8192 allocator chunks and 8192 RM parcel entries.' \
            'Image marker verified; device VM startup remains unverified.' \
            > "$ANYKERNEL3/GUNYAH-ADAPTIVE.txt"
        fi
        grep -qF "${KERNEL_VER}.${SUBLEVEL}${STOCK_RELEASE_EXPECTED}" "$IMAGE_STRINGS"
        grep -qF "$STOCK_VERSION_EXPECTED" "$IMAGE_STRINGS"
        grep -qF "${STOCK_BUILD_USER_EXPECTED}@${STOCK_BUILD_HOST_EXPECTED}" "$IMAGE_STRINGS"
        grep -qF "$STOCK_COMPILER_EXPECTED" "$IMAGE_STRINGS"
        if [[ "$PACKAGE_STRICT_ANYKERNEL" == "true" ]]; then
