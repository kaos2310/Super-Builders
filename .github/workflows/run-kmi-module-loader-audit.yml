name: ReSukiSU KMI Runtime Compatibility

# Recovery build after the strict MODVERSIONS variant bootlooped on SM-S928B.
permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
  push:
    branches:
      - agent/kmi-runtime-compat
    paths:
      - .github/workflows/run-kmi-module-loader-audit.yml
      - android14-6.1/build-helpers/clean-build-flags.sh

# ReSukiSU v4.1.0-35052 with Samsung DLKM runtime compatibility.
jobs:
  dependencies:
    uses: ./.github/workflows/cache-dependencies.yml

  build:
    needs: dependencies
    uses: ./.github/workflows/build-resukisu.yml
    with:
      android_version: android14
      kernel_version: "6.1"
      sub_level: "145"
      os_patch_level: "2025-09"
      add_susfs: true
      add_zeromount: true
      add_droidspaces: true
      add_zram: true
      add_bbg: true
      add_overlayfs_support: true
      add_kpm: false
      susfs_open_redirect: false
      add_ptrace_fix: true
      add_perf_patches: true
      resukisu_source_branch: main
      resukisu_version_code: "35052"
      device_codename: e3q

  package-runtime-compat-zip:
    name: Package KMI-compatible flashable ZIP
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_ARTIFACT: 6.1.145-android14-2025-09-ReSukiSU-35052-AnyKernel3
      OUTPUT_BASENAME: 6.1.145-android14-2025-09-ReSukiSU-35052-AnyKernel3-KMICompat-Audited
    steps:
      - name: Download successful build artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: AnyKernel3

      - name: Create and audit exact flashable ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -s AnyKernel3/Image
          test -s AnyKernel3/anykernel.sh

          cat > AnyKernel3/KMI-RUNTIME-COMPAT.txt <<'EOF'
          S928B KMI runtime compatibility build
          =====================================
          MODVERSIONS CRC mismatches remain visible in dmesg but are accepted
          so Samsung vendor/DLKM modules can load during early boot.
          Genuine module blacklist matches still fail with -EPERM.
          This replaces the strict-CRC audited build that caused a bootloop.
          EOF

          FLASH_ZIP="$RUNNER_TEMP/${OUTPUT_BASENAME}.zip"
          SHA_FILE="$RUNNER_TEMP/${OUTPUT_BASENAME}.zip.sha256"
          rm -f "$FLASH_ZIP" "$SHA_FILE"

          (cd AnyKernel3 && zip -X -qr "$FLASH_ZIP" .)
          unzip -t "$FLASH_ZIP"
          unzip -l "$FLASH_ZIP"

          unzip -p "$FLASH_ZIP" anykernel.sh | grep -F 'susfs_log=0'
          unzip -p "$FLASH_ZIP" anykernel.sh | grep -F 'patch_cmdline "kpti" ""'
          unzip -p "$FLASH_ZIP" anykernel.sh | grep -F 'patch_cmdline "kasan" "off"'
          unzip -p "$FLASH_ZIP" anykernel.sh | grep -F 'avc_log_spoofing 1'
          unzip -p "$FLASH_ZIP" anykernel.sh | grep -F 'hide_sus_mnts_for_all_or_non_su_procs 0'
          unzip -p "$FLASH_ZIP" KMI-RUNTIME-COMPAT.txt | grep -F 'CRC mismatches remain visible'
          if unzip -p "$FLASH_ZIP" anykernel.sh | grep -F 'performance'; then
            echo "::error::Flash ZIP contains a forced performance policy"
            exit 1
          fi

          sha256sum "$FLASH_ZIP" | tee "$SHA_FILE"
          OUTPUT_SHA256=$(awk '{print $1}' "$SHA_FILE")
          {
            echo "OUTPUT_ZIP=$FLASH_ZIP"
            echo "OUTPUT_SHA_FILE=$SHA_FILE"
            echo "OUTPUT_SHA256=$OUTPUT_SHA256"
          } >> "$GITHUB_ENV"

      - name: Upload KMI-compatible ZIP and checksum
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_BASENAME }}
          path: |
            ${{ env.OUTPUT_ZIP }}
            ${{ env.OUTPUT_SHA_FILE }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Packaging summary
        shell: bash
        run: |
          {
            echo "## S928B KMI runtime compatibility package"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| MODVERSIONS CRC handling | Mismatches logged and accepted for Samsung DLKM compatibility |"
            echo "| Module blacklist errno | Genuine blacklist matches return \`-EPERM\` |"
            echo "| Patch rejects before build | Build fails if any \`.rej\` exists |"
            echo "| KPM | Unavailable in pinned ReSukiSU 35052 |"
            echo "| Flash ZIP | \`${OUTPUT_BASENAME}.zip\` |"
            echo "| SHA-256 | \`${OUTPUT_SHA256}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
