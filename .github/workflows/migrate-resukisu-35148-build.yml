name: Prepare ReSukiSU 35148 build workflow blob

on:
  push:
    branches:
      - agent/resukisu-35148-susfs-230
    paths:
      - '.github/workflows/migrate-resukisu-35148-build.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Prepare exact 35148 reusable workflow blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE=.github/workflows/build-resukisu.yml
          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          old = "35146"
          new = "35148"
          count = text.count(old)
          if count != 6:
              raise SystemExit(f"expected exactly 6 ReSukiSU 35146 identity markers, found {count}")
          if new in text:
              raise SystemExit("35148 already present before migration")
          text = text.replace(old, new)
          path.write_text(text, encoding="utf-8", newline="\n")
          updated = path.read_text(encoding="utf-8")
          if old in updated:
              raise SystemExit("stale 35146 marker survived reusable workflow migration")
          if updated.count(new) != 6:
              raise SystemExit(f"expected exactly 6 ReSukiSU 35148 markers after migration, found {updated.count(new)}")
          required = (
              'default: "35148"',
              'Test ReSukiSU 35148 and latest SUSFS with exact C fault injection',
              "inputs.resukisu_version_code == '35148'",
              'RESUKISU_SU_SESSION_PORT=ReSukiSU-35148-SUSFS-88792822-UAPI4',
              'Verify ReSukiSU 35148 compiled integration and attest package',
          )
          for marker in required:
              if marker not in updated:
                  raise SystemExit(f"missing required 35148 workflow marker: {marker}")
          PY

          git diff --check -- "$FILE"
          git diff -- "$FILE"

          CONTENT=$(base64 -w0 "$FILE")
          REMOTE_BLOB_SHA=$(curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" \
            -d "{\"content\":\"${CONTENT}\",\"encoding\":\"base64\"}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
          test -n "$REMOTE_BLOB_SHA"
          echo "REMOTE_BLOB_SHA=$REMOTE_BLOB_SHA"
