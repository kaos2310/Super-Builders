name: S928B SukiSU Ultra 40856 Strict KMI
run-name: "S928B SukiSU Ultra 40856 — exact Samsung DLKM KMI"

on:
  workflow_dispatch:
  push:
    branches:
      - agent/sukisu-ultra-40856-kmi-strict
    paths:
      - '.github/workflows/run-kmi-strict-sukisu-40856.yml'
      - '.github/workflows/build-sukisu-kmi.yml'
      - 'android14-6.1/build-helpers/**'
      - 'android14-6.1/SukiSU-Ultra/**'
      - 'android14-6.1/sukisu-pin.txt'
      - 'android14-6.1/samsung-e3q-dlkm-crc-baseline.tsv'

permissions:
  contents: write
  actions: write

concurrency:
  group: s928b-sukisu-ultra-40856-strict-kmi
  cancel-in-progress: true

jobs:
  dependencies:
    uses: ./.github/workflows/cache-dependencies.yml

  strict-gate:
    name: SukiSU Ultra 40856 full strict KMI gate
    needs: dependencies
    uses: ./.github/workflows/build-sukisu-kmi.yml
    permissions:
      contents: write
      actions: write
    with:
      android_version: android14
      kernel_version: "6.1"
      sub_level: "145"
      os_patch_level: "2025-09"
      add_susfs: true
      add_zeromount: true
      add_droidspaces: true
      add_zram: true
      add_bbg: true
      add_overlayfs_support: true
      add_kpm: false
      susfs_open_redirect: false
      add_ptrace_fix: true
      add_perf_patches: true
      sukisu_commit: 35467545b2826e3acfc88699755981a889956b1a
      sukisu_version_code: "40856"
      device_codename: e3q
      kmi_mode: strict
      kmi_profile: full-strict
      kmi_minimal_config: false
      package_strict_anykernel: true
