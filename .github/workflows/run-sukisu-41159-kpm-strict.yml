name: S928B EZIF SukiSU 41159 KPM DroidSpaces strict KMI SUSFS v2.3.0 UIDGate v1 BootconfigStaticKey v1 Runtime v1
run-name: "S928BXXU6EZIF EUX One UI 9 — SukiSU 41159 + KPM / CPU-PID limits omitted / SUSFS native SELinux port / Runtime v1 / strict KMI"

on:
  workflow_dispatch:
  push:
    branches:
      - SCRUM-6-susfs-runtime-41159-20261107

permissions:
  contents: write
  actions: write

concurrency:
  group: s928b-resukisu-41159-ezif-uidgate-v1-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  gunyah-preflight:
    name: UID gate and Gunyah exact-C preflight tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Validate transformation, budget bounds and exact C function
        run: |
          set -euo pipefail
          python3 -B android14-6.1/build-helpers/susfs-runtime-v1/contract.py
          python3 -B android14-6.1/build-helpers/susfs-runtime-v1/test.py --output "$RUNNER_TEMP/runtime-tests"
          python3 -B android14-6.1/build-helpers/test-fetch-pinned-git.py
          python3 android14-6.1/build-helpers/test-sukisu-41159-bindings.py
          python3 android14-6.1/build-helpers/droidspaces-gki/test.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path('android14-6.1/s928b-ezif-firmware-evidence.json').read_text())
          assert evidence['baseline_run'] == 38052119990
          assert evidence['all_5470_module_import_crcs_identical_to_zzi4']
          assert evidence['strict_baseline_symbols_verified'] == 2485
          assert all(a['md5_verified'] for a in evidence['archives'].values())
          PY
          python3 android14-6.1/build-helpers/test-e3q-gunyah-adaptive-backing.py
          python3 android14-6.1/build-helpers/test-e3q-gunyah-reclaim.py
          python3 android14-6.1/build-helpers/susfs-uid-gated/test.py --cc gcc --work-dir "$RUNNER_TEMP/uid-gate-tests"
      - name: Upload verified Samsung source readiness report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: EZIF-firmware-evidence-${{ github.run_id }}
          path: android14-6.1/s928b-ezif-firmware-evidence.json
          if-no-files-found: error
          retention-days: 7

  userspace:
    needs: gunyah-preflight
    uses: ./.github/workflows/build-sukisu-41159-userspace.yml
    with:
      resukisu_commit: fae5788d2984e0c5844e8af96a18c569225d9774
      resukisu_version_code: "41159"

  dependencies:
    needs: gunyah-preflight
    uses: ./.github/workflows/cache-dependencies.yml

  zeromount-compat:
    needs: gunyah-preflight
    uses: ./.github/workflows/build-zeromount-sukisu-41159.yml

  strict-gate:
    name: Strict KMI / SukiSU 41159 UAPI6 / DroidSpaces / OPEN_REDIRECT / UID-gated hiding v1 / Gunyah
    needs: [dependencies, userspace, zeromount-compat]
    uses: ./.github/workflows/build-sukisu-41159-kpm-strict.yml
    permissions:
      contents: write
      actions: write
    with:
      android_version: android14
      kernel_version: "6.1"
      sub_level: "162"
      os_patch_level: "2026-03"
      add_susfs: true
      susfs_uid_gated_hiding: true
      susfs_runtime_setters: true
      add_zeromount: true
      add_droidspaces: true
      droidspaces_resource_limits: false
      add_zram: true
      add_bbg: true
      add_overlayfs_support: true
      add_kpm: true
      susfs_open_redirect: true
      # Adapt the SUSFS 5369359d callback to native UAPI6, retaining the explicit
      # session decision and success guard from reference run 34262304602.
      # The legacy 35119/UAPI2 backport is not applicable to native UAPI6.
      susfs_su_session: false
      add_ptrace_fix: true
      add_perf_patches: true
      sukisu_commit: fae5788d2984e0c5844e8af96a18c569225d9774
      resukisu_source_branch: main
      resukisu_version_code: "41159"
      device_codename: e3q
      kmi_mode: strict
      kmi_profile: full-strict
      kmi_minimal_config: false
      package_strict_anykernel: true

# Functional baseline: successful run 42129383180 @ 4369dc1ae64d3e98e0b83452118ae15f3e5a5a78.
# Preserve its verified ZeroMount CLI installer fix and all strict firmware/ABI gates.
# Exact SukiSU pin fae5788d: 40000 + 3974 - 2815 = 41159; kernel and userspace rebuilt together.
# Latest user instruction omits CPU/PID limits: CGROUP_PIDS=n, CFS_BANDWIDTH=n. No module CRC bypass.
# The SukiSU41159 SUSFS port requires matched independent ARM64 and fault-test evidence.
# Flash packaging depends on all strict stock module ABI and embedded configuration gates.
